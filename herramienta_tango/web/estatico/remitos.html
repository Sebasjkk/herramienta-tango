<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Remitos | Herramienta Sianco</title>
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/comun.css">
<script>try{var t=localStorage.getItem("ht_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
<style>
  .diag h3 { font-size: .92rem; margin: 16px 0 6px; }
  .diag .veredicto { font-size: 1rem; font-weight: 600; margin: 4px 0 2px; }
  .diag .veredicto.ok { color: var(--patina); }
  .diag .veredicto.no { color: var(--ambar); }
  .diag dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: .88rem; }
  .diag dt { color: var(--plomo); }
  .diag dd { margin: 0; overflow-wrap: anywhere; }
  .diag ul { margin: 0; padding-left: 18px; font-size: .88rem; }
  .diag li { margin: 3px 0; }
  .diag li small { color: var(--plomo); }
  .diag details { margin-top: 14px; font-size: .82rem; }
  .diag details textarea { width: 100%; font-size: .72rem; margin-top: 6px; }
  .explica { margin: 8px 0 0; font-size: .86rem; max-width: 70ch; }
  .pestanas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pestana { font: inherit; font-size: .88rem; font-weight: 600; min-height: 36px; padding: 4px 14px; border-radius: 999px;
    border: 1px solid var(--linea); background: var(--papel); color: var(--plomo); cursor: pointer; }
  .pestana b { font-variant-numeric: tabular-nums; margin-left: 4px; color: var(--grafito); }
  .pestana[aria-selected="true"] { background: var(--patina); border-color: var(--patina); color: var(--sobre-color); }
  .pestana[aria-selected="true"] b { color: var(--sobre-color); }
  @media (max-width: 599px) {
    .pestanas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .pestanas::-webkit-scrollbar { display: none; }
    .pestana { flex: none; }
  }
  .remitos { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .remito { padding: 0; overflow: hidden; }
  .remito > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 14px;
    padding: 12px 16px; align-items: baseline; }
  .remito > summary::-webkit-details-marker { display: none; }
  .remito > summary:hover .cli { color: var(--patina); }
  .remito .num { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .remito .cli { font-weight: 600; overflow-wrap: anywhere; }
  .remito .fec { color: var(--plomo); font-size: .88rem; white-space: nowrap; text-align: right; }
  .remito .ped { grid-column: 2 / span 2; font-size: .85rem; color: var(--plomo); }
  .ped .sin { color: var(--oxido); font-weight: 600; }
  .ped .con { color: var(--grafito); font-weight: 600; }
  .ped a.pdf, .num a.pdf { color: var(--patina); text-decoration: underline; text-underline-offset: 2px; }
  .remito[open] > summary { border-bottom: 1px solid var(--linea-suave); }
  .remito .cuerpo { padding: 10px 16px 14px; }
  .remito table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .remito td, .remito th { padding: 6px 4px; border-bottom: 1px solid var(--linea-suave); text-align: left; vertical-align: top; }
  .remito th { font-size: .78rem; color: var(--plomo); font-weight: 600; }
  .remito .der { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .remito .partidas { display: block; font-size: .8rem; color: var(--plomo); }
  .remito .cod { display: block; font-size: .78rem; color: var(--plomo); }
  .aviso-posible { margin: 10px 0 0; padding: 8px 10px; border-radius: var(--radio); background: color-mix(in srgb, var(--advertencia, #B7791F) 12%, transparent); }
  .remito.anulado { opacity: .62; }
  .remito.anulado .num { text-decoration: line-through; text-decoration-thickness: 1px; }
  .acciones-rem { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .mas { text-align: center; color: var(--plomo); font-size: .88rem; }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1>Remitos</h1>
          <div class="datos"><span id="estado">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar remito</label>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Número, cliente, pedido u orden de compra" enterkeyhint="search">
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
        <div class="pestanas" id="pestanas" role="tablist"></div>
        <p class="nota explica" id="explica"></p>
      </div>
      <p class="mensaje-error" id="aviso" hidden></p>
      <ul class="remitos" id="lista" aria-live="polite"></ul>
      <p class="pie">Solo lectura: los remitos del último año. Se hacen y se anulan en Tango.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script>
(() => {
  "use strict";
  HT.iniciar("remitos");
  const { $, el, norm, tokens, sinCeros, fmt, fecha, pedir, textoError, cajaError } = HT;
  const MAX = 150;
  const GRUPOS = [
    { id: "todos", titulo: "Todos", f: () => true, ayuda: "Todos los remitos de venta del último año, incluidos los anulados (atenuados)." },
    { id: "con", titulo: "Con pedido", f: r => !r.anulado && r.pedidos.length > 0,
      ayuda: "Con pedido: se hicieron desde un pedido de Tango. Si un pedido se entregó en partes, cada remito aparece con el mismo pedido." },
    { id: "sin", titulo: "Sin pedido", f: r => !r.anulado && !r.pedidos.length,
      ayuda: "Sin pedido: se hicieron directo, sin un pedido detrás. No tienen orden de compra del cliente asociada en Tango." },
    { id: "sinfac", titulo: "Sin facturar", f: r => r.sin_facturar === true,
      ayuda: "Sin facturar: ninguna factura está hecha con este remito y Tango lo tiene pendiente. Si aparece una «posible factura», es una del mismo cliente y por el mismo importe que se hizo sin elegir el remito." },
    { id: "anulados", titulo: "Anulados", f: r => r.anulado === true,
      ayuda: "Anulados: remitos que se anularon en Tango. La mercadería volvió al stock; no se entregaron ni se facturan." },
  ];
  let remitos = [], grupo = "todos", mostrar = MAX;
  const params = new URLSearchParams(location.search);
  let abrirSiUno = !!params.get("q");
  if (GRUPOS.some(g => g.id === params.get("pestana"))) grupo = params.get("pestana");
  const renglones = new Map();   // id -> datos | Promise

  const corto = n => (n || "").trim().slice(-8).replace(/^0+/, "") || "0";   // pedido sin el prefijo de sucursal
  const textoBusqueda = r => norm([r.numero_corto, r.numero, r.cliente, r.codigo_cliente,
    ...r.pedidos.flatMap(p => [corto(p.numero), p.orden_compra]), ...(r.facturas || []).map(f => f.numero), ...(r.posibles_facturas || []).map(f => f.numero)].join(" "));

  async function cargar(forzar) {
    $("estado").textContent = "Consultando Tango…";
    try {
      const d = await pedir("/api/remitos/vista", forzar);
      remitos = d.datos.remitos.map(r => ({ ...r, _t: textoBusqueda(r) }));
      $("aviso").hidden = !d.datos.aviso; $("aviso").textContent = d.datos.aviso || "";
      if (d.datos.origen === "ultimo_remito") $("aviso").append(" ", botonDiagnostico());
      $("estado").textContent = HT.textoDatos(d);
      if (forzar) renglones.clear();
      render();
    } catch (e) {
      $("estado").textContent = "Sin datos";
      $("lista").replaceChildren(cajaError(e, () => cargar(true)));
    }
  }

  // Busca en la base que une remitos y pedidos (solo lectura) y deja el resultado para copiar
  function botonDiagnostico() {
    const b = el("button", "boton chico", "Buscar la relación en la base"); b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "Buscando (puede tardar un minuto)…";
      let texto;
      try { texto = JSON.stringify((await pedir("/api/remitos/diagnostico", true)).datos, null, 1); }
      catch (e) { texto = "Error: " + textoError(e); }
      HT.ventana("Relación entre remitos y pedidos", (dlg, cerrar) => {
        const ta = el("textarea"); ta.value = texto; ta.readOnly = true; ta.rows = 16; ta.style.width = "100%"; ta.style.fontSize = ".75rem";
        const acc = el("div", "acciones");
        const cp = el("button", "boton primario", "Copiar"); cp.type = "button";
        cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(texto); cp.textContent = "Copiado"; } catch { ta.select(); document.execCommand("copy"); cp.textContent = "Copiado"; } });
        const c = el("button", "boton", "Cerrar"); c.type = "button"; c.addEventListener("click", cerrar);
        acc.append(c, cp);
        dlg.append(el("p", "", "Copiá esto y pasáselo a quien mantiene la Herramienta."), ta, acc);
      });
      b.disabled = false; b.textContent = "Buscar la relación en la base";
    });
    return b;
  }

  function mostrarParaCopiar(titulo, texto) {
    HT.ventana(titulo, (dlg, cerrar) => {
      const ta = el("textarea"); ta.value = texto; ta.readOnly = true; ta.rows = 16; ta.style.width = "100%"; ta.style.fontSize = ".75rem";
      const acc = el("div", "acciones");
      const cp = el("button", "boton primario", "Copiar"); cp.type = "button";
      cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(texto); } catch { ta.select(); document.execCommand("copy"); } cp.textContent = "Copiado"; });
      const c = el("button", "boton", "Cerrar"); c.type = "button"; c.addEventListener("click", cerrar);
      acc.append(c, cp);
      dlg.append(el("p", "", "Copiá esto y pasáselo a quien mantiene la Herramienta."), ta, acc);
    });
  }

  // Para un remito que se sabe facturado pero cuya factura no aparece: busca en la base donde quedó la relación
  function botonDiagFactura(r) {
    const caja = el("p", "nota");
    const texto0 = "¿Está facturado y no aparece? Buscar su factura en la base";
    const b = el("button", "boton-texto", texto0); b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "Buscando (puede tardar un par de minutos)…";
      try {
        const datos = (await pedir(`/api/remitos/${r.id}/diagnostico-factura`, true)).datos;
        if (datos.error) throw new Error(datos.error);
        mostrarDiagFactura(r, datos);
      } catch (e) { mostrarParaCopiar("Factura del remito " + r.numero_corto, "Error: " + textoError(e)); }
      b.disabled = false; b.textContent = texto0;
    });
    caja.append(b);
    return caja;
  }

  // "R0000800000586" -> "R 0008-00000586"
  const nroComp = n => { n = String(n || "").trim(); const m = n.match(/^([A-Z]?)\s*(\d{4,5})(\d{8})$/); return m ? `${m[1] ? m[1] + " " : ""}${m[2]}-${m[3]}` : n; };
  const ESTADO_MOV = { P: "Pendiente de facturar", F: "Facturado", A: "Anulado" };
  // Que es cada tabla de Tango donde puede aparecer el remito, en palabras
  const TABLAS = {
    GVA54: ["Factura hecha desde el remito", "factura"], GVA107: ["Factura hecha desde el remito (circuito de pedidos)", "factura"],
    GVA12: ["Factura", "factura"], GVA53: ["Renglón de una factura", "factura"],
    GVA55: ["Pedido del que salió", "pedido"], GVA106: ["Pedido del que salió", "pedido"], REFERENCIA_REMITO: ["Pedido del que salió", "pedido"],
    GVA45: ["Textos del remito (descripciones de los renglones)", "texto"], STA09: ["Partidas que salieron del stock", "partida"],
    STA14TY: ["Copia del remito impreso", "texto"],
  };

  function mostrarDiagFactura(r, d) {
    const rem = (d.remito || [])[0] || {};
    const coinc = d.coincidencias || [];
    const deFactura = coinc.filter(c => (TABLAS[c.tabla] || [])[1] === "factura");
    const facturas = new Set();
    for (const c of deFactura) for (const f of c.ejemplo || []) {
      const t = f.TCOMP_V || f.T_COMP_V || f.T_COMP, n = f.NCOMP_V || (c.tabla === "GVA54" ? f.N_COMP : f.N_COMP);
      if (n && n !== rem.N_COMP) facturas.add(`${t || "FAC"} ${nroComp(n)}`);
    }
    const anulado = rem.ESTADO_MOV === "A" || (rem.FECHA_ANU && !String(rem.FECHA_ANU).startsWith("1800"));
    HT.ventana("Remito " + (r.numero_corto || nroComp(rem.N_COMP)), (dlg, cerrar) => {
      const v = el("div", "diag");
      let veredicto, clase;
      if (anulado) { veredicto = "El remito está anulado."; clase = "no"; }
      else if (facturas.size) { veredicto = "Está facturado: " + [...facturas].join(", "); clase = "ok"; }
      else if (deFactura.length) { veredicto = "Tango lo tiene vinculado a una factura."; clase = "ok"; }
      else { veredicto = "Tango no tiene ninguna factura vinculada a este remito."; clase = "no"; }
      v.append(el("p", "veredicto " + clase, veredicto));
      if (!anulado && !deFactura.length) {
        v.append(el("p", "nota", (d.facturas_cliente || []).length
          ? "Abajo están las facturas de ese cliente cerca de la fecha: si alguna es la de este remito, se hizo sin vincularlo."
          : "Tampoco hay facturas de ese cliente entre 15 días antes y 60 días después del remito: lo más probable es que no se haya facturado todavía (o que se facturó a otro cliente)."));
      }

      v.append(el("h3", "", "El remito"));
      const dl = el("dl");
      const fila = (k, val) => { if (val === undefined || val === null || val === "") return; dl.append(el("dt", "", k), el("dd", "", String(val))); };
      fila("Cliente", rem.COD_PRO_CL);
      fila("Fecha", fecha(rem.FECHA_MOV));
      fila("Estado en Tango", anulado ? `Anulado${rem.USUARIO_ANU ? " por " + rem.USUARIO_ANU : ""}` : (ESTADO_MOV[rem.ESTADO_MOV] || rem.ESTADO_MOV));
      if (typeof rem.CANTIDAD_KILOS === "number" && rem.CANTIDAD_KILOS) fila("Kilos", fmt.format(rem.CANTIDAD_KILOS));
      if (typeof rem.IMPORTE_TOTAL_CON_IMPUESTOS === "number" && rem.IMPORTE_TOTAL_CON_IMPUESTOS)
        fila("Importe", "$ " + HT.fmtPrecio.format(rem.IMPORTE_TOTAL_CON_IMPUESTOS) + (rem.COTIZ > 1 ? ` (cotización ${fmt.format(rem.COTIZ)})` : ""));
      fila("Leyendas", [1, 2, 3, 4, 5].map(i => rem["LEYENDA" + i]).filter(Boolean).join(" · "));
      fila("Lo hizo", [rem.USUARIO_INGRESO || rem.USUARIO, rem.TERMINAL_INGRESO].filter(Boolean).join(" en "));
      v.append(dl);

      const partidas = coinc.filter(c => c.tabla === "STA09").flatMap(c => c.ejemplo || []);
      if (partidas.length) {
        v.append(el("h3", "", "Qué salió del stock"));
        const ul = el("ul");
        for (const x of partidas) ul.append(el("li", "", `${x.COD_ARTICU} · partida ${x.N_PARTIDA || "-"} · ${fmt.format(x.CANTIDAD)}`));
        v.append(ul);
      }
      const textos = coinc.filter(c => c.tabla === "GVA45").flatMap(c => c.ejemplo || []).map(x => x.DESC).filter(Boolean);
      if (textos.length) {
        v.append(el("h3", "", "Textos del remito"));
        const ul = el("ul"); for (const t of textos) ul.append(el("li", "", t)); v.append(ul);
      }

      v.append(el("h3", "", "Dónde aparece en Tango"));
      const ul = el("ul");
      for (const c of coinc) {
        const [nombre] = TABLAS[c.tabla] || [`Otra tabla (${c.tabla})`];
        const li = el("li", "", nombre + " ");
        li.append(el("small", "", `${c.tabla}.${c.columna} · ${c.filas} ${c.filas === 1 ? "registro" : "registros"}`));
        ul.append(li);
      }
      if (!coinc.length) ul.append(el("li", "", "En ningún otro lado."));
      v.append(ul);

      const fc = d.facturas_cliente || [];
      v.append(el("h3", "", "Facturas de ese cliente cerca de la fecha"));
      if (!fc.length) v.append(el("p", "nota", "Ninguna."));
      else {
        const ulf = el("ul");
        for (const f of fc) {
          const li = el("li");
          const a = el("a", "", `${f.T_COMP} ${nroComp(f.N_COMP)}`);
          a.href = `/factura.pdf?t=${encodeURIComponent(f.T_COMP)}&n=${encodeURIComponent(f.N_COMP)}`; a.target = "_blank"; a.rel = "noopener";
          li.append(a, el("small", "", ` · ${fecha(f.FECHA_EMIS)}` + (typeof f.IMPORTE === "number" ? ` · $ ${HT.fmtPrecio.format(f.IMPORTE)}` : "")));
          ulf.append(li);
        }
        v.append(ulf);
      }

      const det = el("details"); det.append(el("summary", "", "Datos técnicos (para quien mantiene la Herramienta)"));
      const texto = JSON.stringify({ remito: r.numero, ...d }, null, 1);
      const ta = el("textarea"); ta.value = texto; ta.readOnly = true; ta.rows = 8;
      det.append(ta); v.append(det);

      const acc = el("div", "acciones");
      const cp = el("button", "boton", "Copiar datos técnicos"); cp.type = "button";
      cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(texto); } catch { ta.select(); document.execCommand("copy"); } cp.textContent = "Copiado"; });
      const c = el("button", "boton primario", "Cerrar"); c.type = "button"; c.addEventListener("click", cerrar);
      acc.append(cp, c);
      dlg.append(v, acc);
    });
  }

  function coincide(r, ts) {
    return ts.every(t => r._t.includes(t) || sinCeros(solo(r.numero)).includes(sinCeros(solo(t)) || "\u0000"));
  }
  const solo = t => String(t || "").replace(/\D/g, "");

  function render() {
    const ts = tokens($("q").value);
    const vis = remitos.filter(r => coincide(r, ts));
    const p = $("pestanas"); p.replaceChildren();
    for (const g of GRUPOS) {
      const b = el("button", "pestana", g.titulo); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(g.id === grupo));
      b.append(el("b", "", fmt.format(vis.filter(g.f).length)));
      b.addEventListener("click", () => { grupo = g.id; mostrar = MAX; render(); });
      p.append(b);
    }
    const g = GRUPOS.find(x => x.id === grupo);
    $("explica").textContent = g.ayuda;
    const filas = vis.filter(g.f);
    const ul = $("lista");
    if (!filas.length) { ul.replaceChildren(el("li", "aviso", remitos.length ? "No hay remitos que coincidan." : "No hay remitos en el último año.")); return; }
    ul.replaceChildren(...filas.slice(0, mostrar).map(itemRemito));
    // Entrando con /remitos?q=<numero> y un solo resultado: se abre
    if (abrirSiUno && filas.length === 1) { abrirSiUno = false; const d = ul.querySelector("details"); if (d) d.open = true; }
    if (filas.length > mostrar) {
      const li = el("li", "mas"); const b = el("button", "boton chico", `Ver ${fmt.format(Math.min(MAX, filas.length - mostrar))} más (de ${fmt.format(filas.length - mostrar)})`);
      b.type = "button"; b.addEventListener("click", () => { mostrar += MAX; render(); }); li.append(b); ul.append(li);
    }
  }

  // Numero de comprobante con enlace a su PDF (se abre en otra pestaña, sin abrir/cerrar el remito)
  function linkPdf(texto, href) {
    if (!href) return texto;
    const a = el("a", "pdf", texto); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.title = "Ver el PDF";
    a.addEventListener("click", e => e.stopPropagation());
    return a;
  }

  function itemRemito(r) {
    const li = el("li");
    const d = el("details", "tarjeta remito" + (r.anulado ? " anulado" : ""));
    const s = el("summary");
    const ped = el("span", "ped");
    if (r.anulado) ped.append(el("span", "sin", "Anulado"), r.fecha_anulacion ? ` el ${fecha(r.fecha_anulacion)}` : "",
                              r.usuario_anulacion ? ` por ${r.usuario_anulacion}` : "", " · ");
    if (r.pedidos.length) {
      ped.append(el("span", "con", r.pedidos.length > 1 ? "Pedidos " : "Pedido "));
      r.pedidos.forEach((p, k) => {
        if (k) ped.append(", ");
        // Sin enlace al PDF: Tango no genera el PDF de pedidos por la API (19845 y 12481 responden
        // "no implementado", 26/11/2026). La ruta /pedido/<id>.pdf queda por si aparece una ficha que lo haga.
        ped.append(corto(p.numero), p.orden_compra ? ` · OC ${p.orden_compra}` : "");
      });
    } else ped.append(el("span", "sin", "Sin pedido"));
    if (Array.isArray(r.facturas)) {
      ped.append(" · ");
      const pdfFac = f => f.n_comp ? `/factura.pdf?t=${encodeURIComponent(f.t_comp)}&n=${encodeURIComponent(f.n_comp)}` : null;
      if (r.facturas.length) {
        ped.append(el("span", "con", "Facturado "));
        r.facturas.forEach((f, k) => { if (k) ped.append(", "); ped.append(linkPdf(f.numero, pdfFac(f))); });
      } else if (r.facturado_segun_tango) {
        ped.append(el("span", "con", "Facturado"), " (según Tango)");
      } else {
        ped.append(el("span", "sin", "Sin facturar"));
        const pos = r.posibles_facturas || [];
        if (pos.length) {
          ped.append(" · posible factura ");
          pos.forEach((f, k) => { if (k) ped.append(", "); ped.append(linkPdf(f.numero, pdfFac(f))); });
        }
      }
    }
    const num = el("span", "num"); num.append(linkPdf(r.numero_corto, r.id ? `/remito/${r.id}.pdf` : null));
    s.append(num, el("span", "cli", r.cliente || r.codigo_cliente), el("span", "fec", fecha(r.fecha)), ped);
    d.append(s);
    const cuerpo = el("div", "cuerpo"); d.append(cuerpo);
    d.addEventListener("toggle", () => { if (!d.open) return;
      HT.anotarReciente({ tipo: "remito", clave: r.id, titulo: `Remito ${r.numero_corto}`, sub: r.cliente || r.codigo_cliente, href: "/remitos?q=" + encodeURIComponent(r.numero) });
      detalle(r, cuerpo); });
    li.append(d);
    return li;
  }

  async function detalle(r, cuerpo) {
    if (!r.id) { cuerpo.replaceChildren(el("p", "nota", "Tango no informó el número interno de este remito: no se pueden leer sus artículos.")); return; }
    if (!renglones.has(r.id)) renglones.set(r.id, pedir(`/api/remitos/${r.id}/renglones`, true).then(x => x.datos));
    cuerpo.replaceChildren(el("p", "nota", "Leyendo los artículos…"));
    try {
      const d = await renglones.get(r.id);
      if (!d.renglones.length) { cuerpo.replaceChildren(el("p", "nota", "No se encontraron artículos para este remito.")); return; }
      const t = el("table"); const th = el("tr");
      th.append(el("th", "", "Artículo"), el("th", "der", "Cantidad"));
      const thead = el("thead"); thead.append(th); const tb = el("tbody");
      for (const x of d.renglones.filter(x => x.codigo || x.cantidad)) {
        const tr = el("tr"); const a = el("td");
        a.append(x.descripcion || x.codigo, el("span", "cod", x.codigo));
        if (x.partidas.length) a.append(el("span", "partidas", "Partida " + x.partidas.map(p => `${p.partida} (${fmt.format(p.cantidad)})`).join(", ")));
        tr.append(a, el("td", "der", fmt.format(x.cantidad)));
        tb.append(tr);
      }
      t.append(thead, tb);
      cuerpo.replaceChildren(t);
      if (r.sin_facturar && (r.posibles_facturas || []).length) {
        const f = r.posibles_facturas[0];
        cuerpo.append(el("p", "nota aviso-posible",
          `La factura ${f.numero} (${fecha(f.fecha)}) es del mismo cliente y por el mismo importe, pero se hizo sin elegir este remito: ` +
          `para Tango este remito sigue sin facturar` + (f.sin_entregar ? " y esa factura, sin entregar" : "") + ". Es casi seguro la misma venta. " +
          "De acá en adelante, conviene facturar desde el remito."));
      } else if (r.facturado_segun_tango) {
        cuerpo.append(el("p", "nota", "Tango lo tiene como facturado, pero no se encontró con qué factura."));
      }
      const acc = el("div", "acciones-rem");
      if (!r.anulado) { const et = el("a", "boton chico", "Etiqueta de envío"); et.href = "/etiquetas?remito=" + r.id; acc.append(et); }
      if (r.codigo_cliente) { const cl = el("a", "boton chico", "Ver cliente"); cl.href = "/clientes?ver=" + encodeURIComponent(r.codigo_cliente); acc.append(cl); }
      cuerpo.append(acc);
      if (!d.partidas_leidas) cuerpo.append(el("p", "nota", "No se pudieron leer las partidas de este remito."));
      if (!r.anulado && !(r.facturas && r.facturas.length)) cuerpo.append(botonDiagFactura(r));
    } catch (e) {
      renglones.delete(r.id);
      cuerpo.replaceChildren(el("p", "mensaje-error", textoError(e)));
    }
  }

  if (params.get("q")) $("q").value = params.get("q");
  HT.conectarBuscador($("q"), $("limpiar"), () => { mostrar = MAX; render(); });
  $("actualizar").addEventListener("click", () => cargar(true));
  cargar(false);
})();
</script>
</body>
</html>
