<link rel="stylesheet" href="/etiqueta-codigo.css">
<style>
  /* Lista de resultados */
  .resultados { list-style: none; margin: 0; padding: 0; }
  .res { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; align-items: center; text-align: left;
    font: inherit; color: inherit; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 11px 14px; cursor: pointer; margin-bottom: 8px; }
  .res:hover { border-color: var(--patina); }
  .res[aria-pressed="true"] { border-color: var(--patina); box-shadow: inset 3px 0 0 var(--patina); background: var(--seleccion); }
  .res-cod { font-size: .8rem; color: var(--plomo); font-variant-numeric: tabular-nums; }
  .res-desc { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .res-stock { grid-column: 2; grid-row: 1 / span 2; text-align: right; line-height: 1.15; white-space: nowrap; }
  .res-stock b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .res-stock small { font-size: .78rem; color: var(--plomo); }
  .res-stock.neg b { color: var(--oxido); }
  .res-stock.nada b { color: var(--plomo); font-weight: 500; font-size: .9rem; }

  /* Codigo de barras en la ficha */
  .codigo-art { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 8px 0 4px; }
  .codigo-art .barras { background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 6px 10px 4px; line-height: 0; }
  .codigo-art .barras svg { margin-left: 0 !important; max-width: 100%; }
  .codigo-art .acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tanda-linea { font-size: .82rem; color: var(--plomo); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; }
  .dlg-partidas { list-style: none; margin: 0 0 8px; padding: 0; max-height: 40vh; overflow-y: auto; }
  .dlg-partidas li { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--linea-suave); }
  .dlg-partidas b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .dlg-partidas small { grid-column: 1; color: var(--plomo); font-size: .8rem; }
  .dlg-partidas .campo, .dlg-otra .campo.n { width: 72px; text-align: center; }
  .dlg-partidas .n { grid-column: 2; grid-row: 1 / span 2; }
  .dlg-otra { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: end; margin-bottom: 8px; }

  /* Ficha del articulo */
  .ficha { padding: 18px 18px 8px; }
  .ficha-cod { font-size: .85rem; color: var(--plomo); font-variant-numeric: tabular-nums; }
  .ficha h2 { font-size: 1.35rem; line-height: 1.25; margin: 2px 0 4px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .ficha-adic { color: var(--plomo); margin: 0 0 6px; }
  .datos-art { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .85rem; color: var(--plomo); margin: 8px 0 4px; }
  .datos-art b { color: var(--grafito); font-weight: 600; }
  .seccion { border-top: 1px solid var(--linea); margin: 14px -18px 0; padding: 14px 18px 6px; }
  .seccion-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .seccion h3 { font-size: .95rem; margin: 0; }
  .seccion-cab a { font-size: .85rem; color: var(--patina); font-weight: 600; }
  .total { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 10px; }
  .total b { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .total span { color: var(--plomo); }
  .total.neg b { color: var(--oxido); }
  .nota { font-size: .88rem; color: var(--plomo); margin: 0 0 10px; }
  .nota.alerta { color: var(--oxido); }
  .tabla-envoltura { overflow-x: auto; margin: 0 -18px; padding: 0 6px; }
  .volver { display: none; }

  /* Filtros y orden debajo del buscador */
  .barra-filtros { margin-top: 10px; }
  .resumen-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 8px; }
  .resumen-fila .resumen { margin: 0 2px; }
  .resumen-fila select { flex: none; min-height: 34px; font-size: .82rem; padding-top: 3px; padding-bottom: 3px; }
  /* Vistos hace poco (en este equipo) */
  .recientes { margin: 4px 0 14px; }
  .recientes h2 { font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--plomo); margin: 0 2px 8px; }
  .recientes-lista { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .reciente { flex: none; width: 168px; text-align: left; font: inherit; color: inherit; background: var(--papel); border: 1px solid var(--linea);
    border-radius: var(--radio); padding: 8px 11px; cursor: pointer; }
  .reciente:hover, .reciente[aria-pressed="true"] { border-color: var(--patina); }
  .reciente small { display: block; font-size: .75rem; color: var(--plomo); font-variant-numeric: tabular-nums; }
  .reciente span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .86rem; font-weight: 600; line-height: 1.25; }
  .reciente b { display: block; font-size: .8rem; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .reciente b.neg { color: var(--oxido); }
  .ver-mas { display: block; width: 100%; margin: 4px 0 12px; }
  .camino { border-left: 3px solid var(--patina); background: var(--seleccion); padding: 8px 12px; border-radius: 6px; margin: 2px 0 10px; }
  .camino .lista-mini li { grid-template-columns: 1fr auto; }
  .camino .der { font-weight: 700; color: var(--patina); }
  .precio-compra { margin: 4px 0 8px; }
  .res-stock small { display: block; }
  .res-stock small.en-camino { color: var(--patina); font-weight: 600; }
  .mov-entra { color: var(--verde); }
  .mov-sale { color: var(--oxido); }
  .ficha-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
  .lista-mini { list-style: none; margin: 0; padding: 0; }
  .lista-mini li { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--linea-suave); font-size: .92rem; }
  .lista-mini li:first-child { border-top: 0; }
  .lista-mini a { font-weight: 600; color: var(--patina); }
  .lista-mini small { grid-column: 1 / -1; color: var(--plomo); font-size: .8rem; }

  @media (min-width: 960px) {
    .busqueda.con-resultados { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 20px; align-items: start; }
    .detalle { position: sticky; top: 88px; max-height: calc(100vh - 104px); overflow-y: auto; }
      }
  @media (max-width: 959px) {
    .busqueda.viendo-ficha .resultados-col { display: none; }
    .busqueda:not(.viendo-ficha) .detalle { display: none; }
    .volver { display: inline-flex; margin: 0 0 10px; }
    body:has(.busqueda.viendo-ficha) .barra-filtros { display: none; }   /* en la ficha no hacen falta */
  }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1>Buscar artículo</h1>
          <div class="datos"><span id="datos">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar artículo</label>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="Filtrar por código, descripción, partida o código de barras" enterkeyhint="search" autofocus>
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
        <div class="barra-filtros">
          <div class="filtros" id="filtros" role="group" aria-label="Filtros"></div>
        </div>
        <div hidden>
          <select id="orden" aria-label="Ordenar">
            <option value="relevancia">Más parecidos</option>
            <option value="desc">Descripción A–Z</option>
            <option value="cod">Código</option>
            <option value="stock">Más stock</option>
          </select>
        </div>
      </div>

      <div class="busqueda" id="busqueda">
        <div class="resultados-col" id="resultados-col" aria-live="polite"></div>
        <section class="detalle" id="detalle" aria-live="polite"></section>
      </div>

      <p class="pie">Esta pantalla solo consulta: los datos salen de Tango y no se modifica nada. Los artículos con partidas muestran el stock por lote; los que no llevan partidas, por depósito.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script src="/codigo128.js"></script>
<script src="/etiqueta-codigo.js"></script>
<script>
(() => {
  "use strict";
  const { $, el, norm, sinCeros, tokens, fmt, fmtPrecio, num, fecha, unidad, pedir, textoError, cajaError } = HT;
  const EC = window.EtiquetaCodigo;
  HT.iniciar("buscar");

  const PAGINA = 60;            // filas que se dibujan de entrada; "Mostrar más" suma otra tanda
  let mostrar = PAGINA;
  // Filtros rapidos: cada uno recibe el articulo y su stock (stockDe)
  const FILTROS = [
    { id: "todos", titulo: "Todos", f: () => true },
    { id: "stock", titulo: "Con stock", f: (a, st) => st.total > EPS },
    { id: "sin", titulo: "Sin stock", f: (a, st) => Math.abs(st.total) <= EPS },
    { id: "neg", titulo: "Negativos", f: (a, st) => st.total < -EPS || st.conSaldo.some(l => l.saldo < -EPS), alerta: true },
    { id: "partidas", titulo: "Con partidas", f: a => a.usaPart === true },
    { id: "precio", titulo: "Con precio", f: a => (preciosPor.get(a.cod) || []).some(p => p.precio > 0) },
    { id: "camino", titulo: "En camino", f: a => (importDe(a.cod) || {}).en_camino > EPS },
  ];
  const params = new URLSearchParams(location.search);
  let filtro = FILTROS.some(f => f.id === params.get("f")) ? params.get("f") : "todos";
  const selOrden = $("orden");                  // se muestra junto a la cantidad de resultados
  let orden = params.get("orden") || "";        // "" = automatico: parecidos si hay texto, A-Z si no
  const EPS = 0.0001;
  let arts = new Map();        // codigo -> articulo
  let stockPor = new Map();    // codigo -> [lotes]
  let stockArt = new Map();    // codigo -> [saldo por deposito], para los que no llevan partidas
  let preciosPor = new Map();  // codigo -> [precios]
  let cargado = { articulos: false, stock: false, stockArt: false, precios: false };
  let errores = [];
  let seleccion = null;        // codigo elegido
  let resultados = [];

  // ---------------------------------------------------------------- datos
  // Primero se dibuja lo guardado en el equipo (si hay) y despues lo nuevo de Tango
  async function cargar(forzar) {
    if (arts.size) $("busqueda").classList.add("cargando");
    $("datos").textContent = "Consultando Tango…";
    errores = [];
    let guardadoMasViejo = null;
    const consulta = (ruta, indexar, clave) => {
      const usar = d => { indexar(d.datos); cargado[clave] = true; render(); return d; };
      const previo = d => {
        usar(d);
        if (!guardadoMasViejo || d.actualizado < guardadoMasViejo.actualizado) guardadoMasViejo = d;
        $("datos").textContent = HT.textoDatos(guardadoMasViejo);
      };
      return pedir(ruta, forzar, { previo }).then(usar, e => { errores.push(e); render(); return null; });
    };
    const listos = (await Promise.all([
      consulta("/api/articulos", indexarArticulos, "articulos"),
      consulta("/api/stock/partidas", indexarStock, "stock"),
      consulta("/api/stock/articulos", indexarStockArt, "stockArt"),
      consulta("/api/precios", indexarPrecios, "precios"),
      cargarImportaciones(forzar),
    ])).filter(Boolean);
    $("busqueda").classList.remove("cargando");
    if (listos.length) {
      $("datos").textContent = HT.textoDatos(listos.sort((a, b) => a.actualizado.localeCompare(b.actualizado))[0]);
    } else {
      $("datos").textContent = guardadoMasViejo ? HT.textoDatos(guardadoMasViejo).replace("actualizando…", "sin conexión con Tango") : "Sin datos";
    }
    render();
  }


  function asegurar(codigo, desc) {
    if (!arts.has(codigo)) arts.set(codigo, { cod: codigo, desc: desc || "", adic: "", sin: "", barras: "", um: "", ncm: "", usaPart: null });
    return arts.get(codigo);
  }
  function indexarArticulos(lista) {
    for (const x of lista) {
      const a = asegurar(x.codigo, x.descripcion);
      Object.assign(a, { desc: x.descripcion, adic: x.descripcion_adicional, sin: x.sinonimo, barras: x.codigo_barras,
                         um: x.unidad, ncm: x.ncm, usaPart: x.usa_partidas, puntoPedido: x.punto_pedido });
    }
    reindexarTexto();
  }
  function indexarStock(lista) {
    stockPor = new Map();
    for (const x of lista) {
      const a = asegurar(x.codigo_articulo, x.descripcion);
      if (!a.um) a.um = x.unidad;
      if (!stockPor.has(a.cod)) stockPor.set(a.cod, []);
      stockPor.get(a.cod).push(x);
    }
    reindexarTexto();
  }
  function indexarStockArt(lista) {
    stockArt = new Map();
    for (const x of lista) {
      if (!stockArt.has(x.codigo_articulo)) stockArt.set(x.codigo_articulo, []);
      stockArt.get(x.codigo_articulo).push(x);
      const a = arts.get(x.codigo_articulo);
      if (a && !a.um) a.um = x.unidad;
    }
  }
  function indexarPrecios(lista) {
    preciosPor = new Map();
    const vistos = new Set();
    for (const x of lista) {
      const clave = [x.numero_lista, x.codigo_articulo, x.precio, x.codigo_cliente].join("|");
      if (vistos.has(clave)) continue;
      vistos.add(clave);
      asegurar(x.codigo_articulo, x.descripcion);
      if (!preciosPor.has(x.codigo_articulo)) preciosPor.set(x.codigo_articulo, []);
      preciosPor.get(x.codigo_articulo).push(x);
    }
    reindexarTexto();
  }
  function reindexarTexto() {
    for (const a of arts.values()) {
      const lotes = (stockPor.get(a.cod) || []).map(l => l.partida);
      const txt = norm([a.cod, a.desc, a.adic, a.sin, a.barras, ...lotes].join(" "));
      a._txt = txt + " " + txt.replace(/[^\p{L}\p{N} ]/gu, "");     // "oring" encuentra "O'Ring"
      a._cod = sinCeros(norm(a.cod));
    }
  }

  // Los articulos con partidas se ven por lote; los demas, por deposito (consulta 17668)
  function stockDe(cod) {
    const lotes = stockPor.get(cod) || [];
    const a = arts.get(cod);
    if (!lotes.length && a && a.usaPart === false && stockArt.has(cod)) {
      const deps = stockArt.get(cod);
      return { lotes: [], deps, porDeposito: true, total: deps.reduce((s, d) => s + d.saldo, 0), conSaldo: [] };
    }
    const total = lotes.reduce((s, l) => s + l.saldo, 0);
    return { lotes, total, conSaldo: lotes.filter(l => Math.abs(l.saldo) > EPS) };
  }

  // ---------------------------------------------------------------- busqueda
  // Sin texto devuelve todo el catalogo. Cada resultado trae su stock ya calculado.
  function buscar(texto) {
    const ts = tokens(texto);
    const q = sinCeros(norm(texto));
    const out = [];
    for (const a of arts.values()) {
      if (ts.length && !ts.every(t => a._txt.includes(t) || a._cod.includes(sinCeros(t)))) continue;
      const exacto = !ts.length ? 2 : a._cod === q || norm(a.barras) === norm(texto) ? 0 : a._cod.startsWith(q) ? 1 : 2;
      out.push({ a, st: stockDe(a.cod), exacto });
    }
    return out;
  }

  function ordenar(lista, conTexto) {
    const modo = orden || (conTexto ? "relevancia" : "desc");
    const porDesc = (x, y) => (x.a.desc || "~").localeCompare(y.a.desc || "~", "es");
    const cmp = {
      relevancia: (x, y) => x.exacto - y.exacto || (y.st.total > EPS) - (x.st.total > EPS) || porDesc(x, y),
      desc: porDesc,
      cod: (x, y) => x.a.cod.localeCompare(y.a.cod, "es", { numeric: true }),
      stock: (x, y) => y.st.total - x.st.total || porDesc(x, y),
    }[modo] || porDesc;
    return lista.sort(cmp);
  }

  // Lo elegido (texto, filtro, orden, articulo) queda en la direccion: se puede recargar o mandar el link
  function guardarEnUrl() {
    const p = new URLSearchParams();
    const q = $("q").value.trim();
    if (q) p.set("q", q);
    if (filtro !== "todos") p.set("f", filtro);
    if (orden) p.set("orden", orden);
    if (seleccion) p.set("art", seleccion);
    const nueva = location.pathname + (p.toString() ? "?" + p : "") + location.hash;
    if (nueva !== location.pathname + location.search + location.hash) history.replaceState(history.state, "", nueva);
  }

  // Exportar los articulos de la busqueda y el filtro actuales (todos, no solo los que se dibujaron)
  function exportarLista() {
    const f = FILTROS.find(x => x.id === filtro);
    const nombre = ["Artículos", f.id !== "todos" ? f.titulo.toLowerCase() : "", $("q").value.trim()].filter(Boolean).join(" - ");
    HT.exportar(nombre, [["Código"], ["Descripción"], ["Unidad"], ["Stock", "numero"], ["Lotes con saldo", "numero"], ["Depósitos"],
                          ["Usa partidas"], ["Punto de pedido", "numero"], ["Precios cargados", "numero"]],
      resultados.map(a => {
        const st = stockDe(a.cod);
        const deps = st.porDeposito ? st.deps.filter(d => Math.abs(d.saldo) > EPS).map(d => titulo(d.deposito))
                                    : [...new Set(st.conSaldo.map(l => titulo(l.deposito)))];
        return [a.cod, a.desc, unidad(a.um), (st.lotes.length || st.porDeposito) ? Math.round(st.total * 10000) / 10000 : null,
                st.conSaldo.length || null, deps.join(", "), a.usaPart === true ? "Sí" : a.usaPart === false ? "No" : "",
                a.puntoPedido || null, (preciosPor.get(a.cod) || []).filter(p => p.precio > 0).length || null];
      }));
  }

  // ---------------------------------------------------------------- vistos hace poco
  // Cada equipo recuerda los ultimos articulos que se abrieron (la gente consulta casi siempre los mismos)
  const MAX_RECIENTES = 12;
  const leerRecientes = () => { try { return JSON.parse(localStorage.getItem("ht_recientes") || "[]"); } catch { return []; } };
  function anotarReciente(cod) {
    const r = [cod, ...leerRecientes().filter(x => x !== cod)].slice(0, MAX_RECIENTES);
    try { localStorage.setItem("ht_recientes", JSON.stringify(r)); } catch {}
  }
  function abrir(cod) {
    seleccion = cod;
    anotarReciente(cod);
    guardarEnUrl();
    if (!window.matchMedia("(min-width: 960px)").matches) {
      history.pushState({ ficha: cod }, "", "#art=" + encodeURIComponent(cod));
      $("busqueda").classList.add("viendo-ficha");
      window.scrollTo(0, 0);
    }
  }
  // El orden que se ve no cambia mientras se los toca: se toma al abrir la pagina y al buscar
  let recientesVista = leerRecientes();
  function seccionRecientes() {
    const cods = recientesVista.filter(c => arts.has(c));
    if (!cods.length) return null;
    const s = el("section", "recientes");
    s.append(el("h2", "", "Vistos hace poco"));
    const l = el("div", "recientes-lista");
    for (const cod of cods) {
      const a = arts.get(cod);
      const st = stockDe(cod);
      const b = el("button", "reciente"); b.type = "button";
      b.setAttribute("aria-pressed", String(cod === seleccion));
      b.append(el("small", "", cod), el("span", "", a.desc || "(sin descripción)"));
      if (st.lotes.length || st.porDeposito) b.append(el("b", st.total < -EPS ? "neg" : "", Math.abs(st.total) <= EPS ? "Sin stock" : num(st.total) + " " + unidad(a.um)));
      b.addEventListener("click", () => { abrir(cod); render(); });
      l.append(b);
    }
    s.append(l);
    return s;
  }

  // ---------------------------------------------------------------- dibujo
  function dibujarFiltros(base) {
    const cont = $("filtros");
    cont.replaceChildren();
    for (const f of FILTROS) {
      const n = base.filter(r => f.f(r.a, r.st)).length;
      if (f.id !== "todos" && f.id !== filtro && !n) continue;     // no mostrar filtros vacios
      const b = el("button", "filtro" + (f.alerta ? " alerta" : ""), f.titulo);
      b.type = "button";
      b.setAttribute("aria-pressed", String(f.id === filtro));
      b.append(el("b", "", fmt.format(n)));
      b.addEventListener("click", () => { filtro = f.id; mostrar = PAGINA; render(); });
      cont.append(b);
    }
  }

  function render() {
    const texto = $("q").value;
    const col = $("resultados-col");
    const bus = $("busqueda");
    selOrden.value = orden || (tokens(texto).length ? "relevancia" : "desc");
    if (!arts.size) {
      bus.classList.remove("con-resultados");
      $("filtros").replaceChildren();
      col.replaceChildren(errores.length ? cajaError(errores[0], () => cargar(true)) : HT.esqueleto(8));
      return;
    }
    const base = buscar(texto);
    dibujarFiltros(base);
    const f = FILTROS.find(x => x.id === filtro);
    resultados = ordenar(base.filter(r => f.f(r.a, r.st)), tokens(texto).length).map(r => r.a);
    if (!resultados.length) {
      bus.classList.remove("con-resultados", "viendo-ficha");
      $("detalle").replaceChildren();
      const a = el("div", "aviso");
      const p = el("p");
      if (tokens(texto).length) p.append("Ningún artículo coincide con ", el("strong", "", `«${texto.trim()}»`), filtro !== "todos" ? " con ese filtro." : ".");
      else p.append("No hay artículos con ese filtro.");
      a.append(p);
      if (filtro !== "todos") {
        const b = el("button", "boton chico", "Ver todos"); b.type = "button";
        b.addEventListener("click", () => { filtro = "todos"; render(); });
        a.append(b);
      } else a.append(el("p", "", "Probá con menos palabras o con parte del código."));
      col.replaceChildren(a);
      guardarEnUrl();
      return;
    }
    bus.classList.add("con-resultados");
    if (!seleccion || !arts.has(seleccion)) {
      seleccion = window.matchMedia("(min-width: 960px)").matches ? resultados[0].cod : null;
    }
    const frag = document.createDocumentFragment();
    if (!tokens(texto).length && filtro === "todos") { const r = seccionRecientes(); if (r) frag.append(r); }
    const n = resultados.length;
    const cab = el("div", "resumen-fila");
    frag.append(cab);
    cab.append(el("p", "resumen", n === 1 ? "1 artículo" : n > mostrar
      ? `${fmt.format(n)} artículos · se ven ${fmt.format(mostrar)}` : `${fmt.format(n)} artículos`), selOrden);
    const ul = el("ul", "resultados");
    for (const a of resultados.slice(0, mostrar)) ul.append(filaResultado(a));
    const exp = HT.botonExportar(exportarLista, "Excel"); exp.className = "boton-texto"; exp.title = "Exportar a Excel los artículos que se ven con este filtro";
    cab.querySelector(".resumen").append(" · ", exp);
    frag.append(ul);
    if (n > mostrar) {
      const mas = el("button", "boton ver-mas", `Mostrar ${fmt.format(Math.min(100, n - mostrar))} más`);
      mas.type = "button";
      mas.addEventListener("click", () => { mostrar += 100; render(); });
      frag.append(mas);
    }
    col.replaceChildren(frag);
    guardarEnUrl();
    dibujarFicha();
  }

  function filaResultado(a) {
    const li = el("li");
    const b = el("button", "res");
    b.type = "button";
    b.setAttribute("aria-pressed", String(a.cod === seleccion));
    b.append(el("span", "res-cod", a.cod), el("span", "res-desc", a.desc || "(sin descripción)"));
    const st = stockDe(a.cod);
    const caja = el("span", "res-stock");
    if (st.lotes.length || st.porDeposito) {
      if (st.total < -EPS) caja.classList.add("neg");
      if (Math.abs(st.total) <= EPS) caja.classList.add("nada");
      caja.append(el("b", "", Math.abs(st.total) <= EPS ? "Sin stock" : num(st.total) + " " + unidad(a.um)));
    } else {
      caja.classList.add("nada");
      caja.append(el("b", "", a.usaPart === false ? "" : cargado.stock ? "Sin stock" : ""));
    }
    const np = (preciosPor.get(a.cod) || []).filter(p => p.precio > 0).length;
    if (np) caja.append(el("small", "", np === 1 ? "1 precio" : `${np} precios`));
    const im = importDe(a.cod);
    if (im && im.en_camino > EPS) caja.append(el("small", "en-camino", `vienen ${num(im.en_camino)} ${unidad(a.um)}`));
    b.append(caja);
    b.addEventListener("click", () => {
      abrir(a.cod);
      for (const x of document.querySelectorAll(".res")) x.setAttribute("aria-pressed", String(x === b));
      dibujarFicha();
    });
    li.append(b);
    return li;
  }

  // ---------------------------------------------------------------- codigo de barras
  // El codigo de barras es el mismo codigo de articulo de Tango (Code-128)
  function codigoDeBarras(a) {
    const c = el("div", "codigo-art");
    const b = el("div", "barras");
    try { b.append(EC.barras(a.cod, 9)); } catch { b.textContent = "El código tiene caracteres que no van en un código de barras."; }
    const acc = el("div", "acciones");
    const imp = el("button", "boton chico", "Imprimir etiquetas"); imp.type = "button";
    imp.addEventListener("click", () => dialogoEtiquetas(a));
    acc.append(imp);
    c.append(b, acc);
    const caja = el("div"); caja.append(c, lineaTanda());
    return caja;
  }

  function lineaTanda() {
    const t = EC.tanda.leer();
    const linea = el("div", "tanda-linea");
    if (!t.length) return linea;
    const n = EC.total(t);
    linea.append(`En la tanda: ${n} ${n === 1 ? "etiqueta" : "etiquetas"} de ${t.length} ${t.length === 1 ? "renglón" : "renglones"}.`);
    const ver = el("button", "boton-texto", "Ver e imprimir"); ver.type = "button"; ver.addEventListener("click", dialogoTanda);
    linea.append(ver);
    return linea;
  }
  EC.tanda.alCambiar(() => { if (seleccion) dibujarFicha(); });

  function partidasDe(a) {
    const porPartida = new Map();
    for (const l of stockDe(a.cod).lotes) {
      if (!(l.saldo > EPS) || !l.partida) continue;
      const x = porPartida.get(l.partida) || { partida: l.partida, saldo: 0, depositos: [] };
      x.saldo += l.saldo;
      if (!x.depositos.includes(l.deposito)) x.depositos.push(l.deposito);
      porPartida.set(l.partida, x);
    }
    return [...porPartida.values()].sort((x, y) => x.partida.localeCompare(y.partida, "es", { numeric: true }));
  }

  function campoN(valor, alCambiar) {
    const n = el("input", "campo n"); n.type = "number"; n.min = 0; n.max = 200; n.inputMode = "numeric"; n.value = valor;
    n.setAttribute("aria-label", "Cantidad de etiquetas");
    n.addEventListener("focus", () => n.select());
    n.addEventListener("input", () => alCambiar(Math.max(0, Math.min(200, parseInt(n.value) || 0))));
    return n;
  }

  function dialogoEtiquetas(a) {
    HT.ventana("Etiquetas de " + a.cod, (d, cerrar) => {
      const cant = new Map();                 // partida ("" = sin partida) -> cantidad
      let otra = "", nOtra = 0;
      const pedido = () => {
        const lista = [...cant].filter(([, n]) => n > 0).map(([p, n]) => ({ codigo: a.cod, descripcion: a.desc, partida: p, cantidad: n }));
        if (otra && nOtra > 0) lista.push({ codigo: a.cod, descripcion: a.desc, partida: otra, cantidad: nOtra });
        return lista;
      };
      const vista = el("div");
      const resumen = el("p", "nota");
      const imp = el("button", "boton primario", "Imprimir"); imp.type = "button";
      const sumar = el("button", "boton", "Agregar a la tanda"); sumar.type = "button";
      const actualizar = () => {
        const p = pedido();
        const muestra = p[0] || { codigo: a.cod, descripcion: a.desc, partida: a.usaPart ? ((partidasDe(a)[0] || {}).partida || "") : "" };
        try { EC.vista(vista, muestra); } catch (e) { vista.textContent = e.message; }
        const n = EC.total(p);
        imp.disabled = sumar.disabled = !n;
        resumen.textContent = !n ? "Poné cuántas etiquetas querés." : n === 1 ? "Sale 1 etiqueta." : `Salen ${n} etiquetas.`;
      };

      if (a.usaPart) {
        const ps = partidasDe(a);
        d.append(el("p", "", ps.length ? "Una etiqueta por tambor o bulto: poné cuántas de cada partida."
                                        : "No tiene partidas con stock en Tango. Si llegó mercadería nueva, escribí la partida."));
        const ul = el("ul", "dlg-partidas");
        for (const p of ps) {
          const li = el("li");
          li.append(el("b", "", p.partida), campoN(0, n => { cant.set(p.partida, n); actualizar(); }),
                    el("small", "", `${num(p.saldo)} ${unidad(a.um)} · ${p.depositos.map(x => x.charAt(0) + x.slice(1).toLowerCase()).join(", ")}`));
          ul.append(li);
        }
        if (ps.length) d.append(ul);
        const o = el("div", "dlg-otra");
        const caja = el("div");
        const inp = HT.campo(caja, "Otra partida", { maxLength: 30, autocomplete: "off" });
        const n = campoN(0, v => { nOtra = v; actualizar(); });
        inp.addEventListener("input", () => {
          otra = inp.value.trim().toUpperCase();
          if (otra && !nOtra) { nOtra = 1; n.value = 1; }
          actualizar();
        });
        o.append(caja, n);
        d.append(o);
      } else {
        d.append(el("p", "", "Este artículo no lleva partidas: la etiqueta lleva solo su código."));
        const ul = el("ul", "dlg-partidas"); const li = el("li");
        cant.set("", 1);
        li.append(el("b", "", "Etiquetas"), campoN(1, n => { cant.set("", n); actualizar(); }));
        ul.append(li); d.append(ul);
      }
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cerrar"); c.type = "button"; c.addEventListener("click", cerrar);
      imp.addEventListener("click", () => EC.imprimir(pedido()));
      sumar.addEventListener("click", () => { EC.tanda.agregar(pedido()); cerrar(); });
      acc.append(c, sumar, imp);
      d.append(vista, resumen, acc);
      actualizar();
      requestAnimationFrame(actualizar);       // la vista previa necesita la ventana ya abierta para medir el ancho
    });
  }

  function dialogoTanda() {
    HT.ventana("Tanda para imprimir", (dlg, cerrar) => {
      const d = el("div"); dlg.append(d);
      const dibujar = () => {
        const t = EC.tanda.leer();
        d.replaceChildren();
        if (!t.length) { d.append(el("p", "", "La tanda está vacía.")); }
        const ul = el("ul", "dlg-partidas");
        t.forEach((x, i) => {
          const li = el("li");
          const txt = el("span"); txt.append(el("b", "", `${x.cantidad} × ${x.codigo}`), x.partida ? ` · partida ${x.partida}` : "");
          const q = el("button", "boton chico peligro", "Quitar"); q.type = "button"; q.classList.add("n");
          q.addEventListener("click", () => { EC.tanda.quitar(i); dibujar(); });
          li.append(txt, q, el("small", "", x.descripcion));
          ul.append(li);
        });
        if (t.length) d.append(ul);
        const acc = el("div", "acciones");
        const c = el("button", "boton", "Cerrar"); c.type = "button"; c.addEventListener("click", cerrar);
        acc.append(c);
        if (t.length) {
          const v = el("button", "boton", "Vaciar"); v.type = "button";
          v.addEventListener("click", () => { if (confirm("¿Vaciar la tanda?")) { EC.tanda.vaciar(); dibujar(); } });
          const imp = el("button", "boton primario", `Imprimir ${EC.total(t)}`); imp.type = "button";
          imp.addEventListener("click", () => EC.imprimir(EC.tanda.leer()));
          acc.append(v, imp);
        }
        d.append(acc);
      };
      dibujar();
    });
  }

  function dibujarFicha() {
    const cont = $("detalle");
    const a = seleccion && arts.get(seleccion);
    if (!a) { cont.replaceChildren(); return; }
    const t = el("article", "tarjeta ficha");

    const volver = el("button", "boton volver", "‹ Resultados");
    volver.type = "button";
    volver.addEventListener("click", () => history.back());
    t.append(volver);

    t.append(el("div", "ficha-cod", a.cod), el("h2", "", a.desc || "(sin descripción)"));
    if (a.adic) t.append(el("p", "ficha-adic", a.adic));
    const datos = el("div", "datos-art");
    const dato = (et, v) => { if (!v) return; const s = el("span"); s.append(et + " ", el("b", "", v)); datos.append(s); };
    dato("Unidad", unidad(a.um));
    dato("NCM", a.ncm);
    dato("Código de barras", a.barras);
    if (a.puntoPedido) dato("Punto de pedido", num(a.puntoPedido));
    if (datos.childNodes.length) t.append(datos);
    const acc = el("div", "ficha-acciones");
    const link = el("button", "boton chico", "Copiar link"); link.type = "button";
    link.title = "Para mandar este artículo por WhatsApp o mail";
    link.addEventListener("click", () => HT.copiarLink("/buscar?art=" + encodeURIComponent(a.cod)));
    acc.append(link);
    t.append(acc, codigoDeBarras(a));

    t.append(seccionStock(a), seccionImportaciones(a), seccionMovimientos(a), seccionPrecios(a), seccionCotizaciones(a));
    cont.replaceChildren(t);
  }

  // Articulos sin partidas: total y saldo por deposito
  function stockPorDeposito(s, a, st) {
    const tot = el("div", "total" + (st.total < -EPS ? " neg" : ""));
    tot.append(el("b", "", num(st.total)), el("span", "", unidad(a.um) + " en total"));
    s.append(tot);
    const conMov = st.deps.filter(d => Math.abs(d.saldo) > EPS || d.comprometido > EPS || d.a_recibir > EPS);
    if (conMov.length > 1 || (conMov.length === 1 && titulo(conMov[0].deposito) !== "Central")) {
      s.append(el("p", "nota", conMov.map(d => `${titulo(d.deposito)}: ${num(d.saldo)} ${unidad(a.um)}`).join(" · ")));
    }
    const comp = st.deps.reduce((x, d) => x + d.comprometido, 0);
    const rec = st.deps.reduce((x, d) => x + d.a_recibir, 0);
    const extra = [comp > EPS ? `Comprometido en pedidos: ${num(comp)}` : "", rec > EPS ? `A recibir: ${num(rec)}` : ""].filter(Boolean);
    if (extra.length) s.append(el("p", "nota", extra.join(". ") + "."));
    if (st.total < -EPS) s.append(el("p", "nota alerta", "Saldo negativo: en Tango salió más de lo que entró. Suele pasar cuando se remite algo cuyo ingreso nunca se cargó."));
    s.append(el("p", "nota", "Este artículo no lleva partidas: el stock se ve por depósito, sin lotes."));
    return s;
  }

  function seccionStock(a) {
    const s = el("section", "seccion");
    const cab = el("div", "seccion-cab");
    cab.append(el("h3", "", "Stock"));
    const st = stockDe(a.cod);
    if (st.lotes.length) {
      const link = el("a", "", "Ver en Stock por partida");
      link.href = "/stock?q=" + encodeURIComponent(a.cod);
      cab.append(link);
    }
    s.append(cab);

    if (!cargado.stock || (a.usaPart === false && !cargado.stockArt)) { s.append(el("p", "nota", "Cargando stock…")); return s; }
    if (st.porDeposito) return stockPorDeposito(s, a, st);
    if (!st.lotes.length) {
      s.append(el("p", "nota", a.usaPart === false
        ? "Este artículo no lleva partidas y Tango no le registra saldo."
        : "No tiene lotes registrados en Tango."));
      return s;
    }
    const tot = el("div", "total" + (st.total < -EPS ? " neg" : ""));
    tot.append(el("b", "", num(st.total)), el("span", "", unidad(a.um) + " en total"));
    s.append(tot);

    // Por deposito, si hay mas de uno
    const porDep = new Map();
    for (const l of st.conSaldo) porDep.set(l.deposito, (porDep.get(l.deposito) || 0) + l.saldo);
    if (porDep.size > 1) {
      s.append(el("p", "nota", [...porDep].map(([d, v]) => `${titulo(d)}: ${num(v)} ${unidad(a.um)}`).join(" · ")));
    }
    const negs = st.conSaldo.filter(l => l.saldo < -EPS);
    if (negs.length) {
      s.append(el("p", "nota alerta", negs.length === 1
        ? "Hay un lote en negativo: salió más de lo que entró en ese lote."
        : `Hay ${negs.length} lotes en negativo: salió más de lo que entró en esos lotes.`));
    }
    if (!st.conSaldo.length) {
      s.append(el("p", "nota", "Todos sus lotes están en cero."));
      return s;
    }
    const tabla = el("table", "tabla");
    const thead = el("thead"); const trh = el("tr");
    const cols = [["Lote", ""], ["Depósito", ""], ["Despacho", ""], ["Vence", ""], ["Saldo", "der"]];
    for (const [c, cl] of cols) trh.append(el("th", cl, c));
    thead.append(trh);
    const tbody = el("tbody");
    for (const l of [...st.conSaldo].sort((x, y) => (x.id_partida ?? 0) - (y.id_partida ?? 0))) {
      const tr = el("tr", l.saldo < -EPS ? "neg" : "");
      tr.append(el("td", "", l.partida || "sin número"), el("td", "", titulo(l.deposito)), el("td", "", l.despacho),
                el("td", "", fecha(l.vencimiento)), el("td", "der", num(l.saldo) + " " + unidad(l.unidad || a.um)));
      tbody.append(tr);
    }
    tabla.append(thead, tbody);
    const env = el("div", "tabla-envoltura"); env.append(tabla);
    s.append(env);
    return s;
  }

  // Precios leidos de las tablas de Tango (precio de lista y especiales por cliente)
  const preciosArt = new Map();   // codigo -> datos | "cargando" | Error
  function cargarPreciosDe(cod) {
    if (preciosArt.has(cod)) return;
    preciosArt.set(cod, "cargando");
    pedir("/api/articulos/" + encodeURIComponent(cod) + "/precios")
      .then(d => preciosArt.set(cod, d.datos), e => preciosArt.set(cod, new Error(textoError(e))))
      .then(() => { if (seleccion === cod) dibujarFicha(); });
  }

  function seccionPrecios(a) {
    const s = el("section", "seccion");
    const cab = el("div", "seccion-cab");
    cab.append(el("h3", "", "Precios"));
    s.append(cab);
    cargarPreciosDe(a.cod);
    const ps = preciosArt.get(a.cod);
    if (ps === "cargando") { s.append(HT.esqueleto(2, "plano")); return s; }
    if (ps instanceof Error) { s.append(el("p", "nota alerta", ps.message)); return s; }
    if (!ps.length) { s.append(el("p", "nota", "No está en ninguna lista de precios.")); return s; }
    const tabla = el("table", "tabla");
    const thead = el("thead"); const trh = el("tr");
    for (const [c, cl] of [["Lista", ""], ["Cliente", ""], ["Precio", "der"]]) trh.append(el("th", cl, c));
    thead.append(trh);
    const tbody = el("tbody");
    const fila = (p, cliente, valor) => {
      const tr = el("tr", valor > 0 ? "" : "apagado");
      const lista = el("td");
      const link = el("a", "", p.lista);
      link.href = "/precios#lista=" + p.id_lista; link.style.color = "inherit";
      lista.append(link);
      const precio = el("td", "der");
      if (valor > 0) precio.append(el("span", "moneda", p.moneda), fmtPrecio.format(valor));
      else precio.textContent = "Sin precio";
      tr.append(lista, el("td", "", cliente), precio);
      tbody.append(tr);
    };
    for (const p of ps) {
      for (const e of p.especiales) fila(p, e.razon_social || e.codigo_cliente, e.precio);
      if (p.precio > 0 || !p.especiales.length) fila(p, "Todos", p.precio);
    }
    tabla.append(thead, tbody);
    const env = el("div", "tabla-envoltura"); env.append(tabla);
    s.append(env);
    return s;
  }

  // ---------------------------------------------------------------- importaciones
  // De las carpetas de importacion (base de Tango, solo lectura): lo que esta en camino
  // (pedido y todavia no nacionalizado) y el precio que se le pago al proveedor.
  let importaciones = null;       // { articulos: {codigo: {...}}, carpetas: [...] } | Error
  const importPorNorm = new Map();
  function cargarImportaciones(forzar) {
    const usar = d => {
      importaciones = d.datos;
      importPorNorm.clear();
      for (const [cod, v] of Object.entries(importaciones.articulos || {})) importPorNorm.set(sinCeros(norm(cod)), v);
      render();
    };
    // No cuenta como error de la pantalla: si falla, la ficha lo dice en su seccion
    return pedir("/api/importaciones", forzar, { previo: usar }).then(d => { usar(d); return null; }, e => { importaciones = e; render(); return null; });
  }
  const importDe = cod => importaciones && !(importaciones instanceof Error)
    ? (importaciones.articulos[cod] || importPorNorm.get(sinCeros(norm(cod)))) : null;

  function seccionImportaciones(a) {
    const s = el("section", "seccion");
    const cab = el("div", "seccion-cab");
    cab.append(el("h3", "", "Importaciones"));
    s.append(cab);
    if (importaciones === null) { s.append(HT.esqueleto(2, "plano")); return s; }
    if (importaciones instanceof Error) { s.append(el("p", "nota", "No se pudieron leer las carpetas de importación: " + textoError(importaciones))); return s; }
    const im = importDe(a.cod);
    if (!im || (!im.en_camino && !im.compras.length)) { s.append(el("p", "nota", "No figura en ninguna carpeta de importación.")); return s; }
    const u = unidad(a.um);
    if (im.en_camino > EPS) {
      const caja = el("div", "camino");
      caja.append(el("b", "", `En camino: ${num(im.en_camino)} ${u}`));
      const ul = el("ul", "lista-mini");
      for (const c of im.carpetas_en_camino) {
        const li = el("li");
        li.append(el("span", "", `Carpeta ${c.corto}${c.proveedor ? " · " + c.proveedor : ""}`),
                  el("span", "der", `faltan ${num(c.falta)} ${u}`),
                  el("small", "", [c.fecha && "abierta el " + fecha(c.fecha), `pedido ${num(c.pedido)}, llegó ${num(c.llego)}`, c.estado && "estado " + c.estado].filter(Boolean).join(" · ")));
        ul.append(li);
      }
      caja.append(ul);
      s.append(caja);
    }
    if (im.ultima_compra) {
      const c = im.ultima_compra;
      const p = el("p", "precio-compra");
      p.append("Último precio de compra: ", el("b", "", `${c.moneda || ""} ${fmtPrecio.format(c.precio)}`.trim() + (u ? " por " + u : "")),
               ` · carpeta ${c.corto}${c.fecha ? " del " + fecha(c.fecha) : ""}${c.proveedor ? " · " + c.proveedor : ""}`);
      s.append(p);
      if (c.equivalencia && Math.abs(c.equivalencia - 1) > 0.0001) {
        s.append(el("p", "nota", `En la carpeta figura ${c.moneda || ""} ${fmtPrecio.format(c.precio_compra)} por unidad de compra; se pasó a la unidad de stock con la equivalencia ${num(c.equivalencia)}.`));
      }
      if (im.compras.length > 1) {
        const tabla = el("table", "tabla");
        const th = el("tr");
        for (const [x, cl] of [["Carpeta", ""], ["Fecha", ""], ["Proveedor", ""], ["Cantidad", "der"], ["Precio", "der"]]) th.append(el("th", cl, x));
        const thead = el("thead"); thead.append(th); const tb = el("tbody");
        for (const x of im.compras) {
          const tr = el("tr");
          const pr = el("td", "der"); pr.append(el("span", "moneda", x.moneda || ""), fmtPrecio.format(x.precio));
          tr.append(el("td", "", x.corto), el("td", "", fecha(x.fecha)), el("td", "", x.proveedor), el("td", "der", num(x.cantidad) + " " + u), pr);
          tb.append(tr);
        }
        tabla.append(thead, tb);
        const env = el("div", "tabla-envoltura"); env.append(tabla);
        s.append(env);
      }
    }
    s.append(el("p", "nota", "Precio del proveedor, sin gastos de importación (esos todavía no están completos en Tango)."));
    return s;
  }

  // Ultimos movimientos de stock, leidos de la base de Tango (solo lectura). Se piden con un boton:
  // cada consulta corre en el servidor y tarda un par de segundos.
  const movsArt = new Map();      // codigo -> datos | "cargando" | Error
  function seccionMovimientos(a) {
    const s = el("section", "seccion");
    const cab = el("div", "seccion-cab");
    cab.append(el("h3", "", "Movimientos"));
    s.append(cab);
    const ms = movsArt.get(a.cod);
    const pedirMovs = () => {
      movsArt.set(a.cod, "cargando"); dibujarFicha();
      pedir("/api/articulos/" + encodeURIComponent(a.cod) + "/movimientos")
        .then(d => movsArt.set(a.cod, d.datos), e => movsArt.set(a.cod, e))
        .then(() => { if (seleccion === a.cod) dibujarFicha(); });
    };
    if (!ms) {
      s.append(el("p", "nota", "Remitos, ajustes, ingresos y egresos de este artículo: sirve para entender de dónde sale el saldo."));
      const b = el("button", "boton chico", "Ver movimientos"); b.type = "button"; b.addEventListener("click", pedirMovs);
      s.append(b);
      return s;
    }
    if (ms === "cargando") { s.append(HT.esqueleto(3, "plano")); return s; }
    if (ms instanceof Error) {
      s.append(cajaError(ms, pedirMovs));
      return s;
    }
    if (!ms.length) { s.append(el("p", "nota", "Tango no tiene movimientos de stock de este artículo.")); return s; }
    const exp = HT.botonExportar(() => HT.exportar(`Movimientos ${a.cod}`,
      [["Fecha"], ["Comprobante"], ["Número"], ["Cliente o proveedor"], ["Partida"], ["Depósito"], ["Cantidad", "numero"]],
      ms.map(m => [fecha(m.fecha), m.tipo, m.numero, m.tercero, m.partida, m.deposito, m.cantidad])), "Exportar");
    exp.className = "boton-texto";
    cab.append(exp);
    const conPartida = ms.some(m => m.partida);
    const tabla = el("table", "tabla");
    const thead = el("thead"); const trh = el("tr");
    for (const [c, cl] of [["Comprobante", ""], ["Fecha", ""], ["Cliente o proveedor", ""], ...(conPartida ? [["Partida", ""]] : []), ["Cantidad", "der"]]) trh.append(el("th", cl, c));
    thead.append(trh);
    const tbody = el("tbody");
    for (const m of ms) {
      const tr = el("tr");
      const comp = el("td"); comp.append(el("div", "", m.tipo || m.t_comp)); comp.firstChild.style.fontWeight = "600";
      comp.append(el("div", "nota", m.numero)); comp.lastChild.style.margin = "0";
      const cant = el("td", "der " + (m.cantidad < 0 ? "mov-sale" : "mov-entra"), (m.cantidad > 0 ? "+" : "") + num(m.cantidad) + " " + unidad(a.um));
      tr.append(comp, el("td", "", fecha(m.fecha)), el("td", "", m.tercero), ...(conPartida ? [el("td", "", m.partida)] : []), cant);
      tbody.append(tr);
    }
    tabla.append(thead, tbody);
    const env = el("div", "tabla-envoltura"); env.append(tabla);
    s.append(env);
    if (ms.length >= 60) s.append(el("p", "nota", "Se ven los últimos 60."));
    return s;
  }

  // Cotizaciones en las que aparece el articulo (las mas nuevas primero)
  const cotizArt = new Map();     // codigo -> datos | "cargando" | Error
  function seccionCotizaciones(a) {
    const s = el("section", "seccion");
    const cab = el("div", "seccion-cab");
    cab.append(el("h3", "", "Cotizaciones"));
    s.append(cab);
    if (!cotizArt.has(a.cod)) {
      cotizArt.set(a.cod, "cargando");
      pedir("/api/articulos/" + encodeURIComponent(a.cod) + "/cotizaciones")
        .then(d => cotizArt.set(a.cod, d.datos), e => cotizArt.set(a.cod, e))
        .then(() => { if (seleccion === a.cod) dibujarFicha(); });
    }
    const cs = cotizArt.get(a.cod);
    if (cs === "cargando") { s.append(HT.esqueleto(2, "plano")); return s; }
    if (cs instanceof Error) { s.append(el("p", "nota alerta", textoError(cs))); return s; }
    if (!cs.length) { s.append(el("p", "nota", "No aparece en ninguna cotización cargada en Tango.")); return s; }
    const hoy = new Date().toISOString().slice(0, 10);
    const ul = el("ul", "lista-mini");
    for (const c of cs.slice(0, 8)) {
      const li = el("li");
      const l = el("a", "", c.numero_corto); l.href = "/cotizaciones?ver=" + c.id;
      const izq = el("span"); izq.append(l, " · " + (c.cliente || c.codigo_cliente));
      const vencida = c.estado === 2 && c.vigencia && c.vigencia < hoy;
      const clase = vencida ? "vencida" : ({ 2: "autorizada", 4: "procesada", 5: "anulada" })[c.estado] || "";
      li.append(izq, el("span", "etiqueta-estado e-" + clase, vencida ? "Vencida" : c.estado_texto),
                el("small", "", `${fecha(c.fecha)} · ${num(c.cantidad)} ${unidad(a.um)} a ${c.moneda} ${fmtPrecio.format(c.precio)}`));
      ul.append(li);
    }
    s.append(ul);
    if (cs.length > 8) s.append(el("p", "nota", `y ${cs.length - 8} más.`));
    return s;
  }

  const titulo = d => d ? d.charAt(0) + d.slice(1).toLowerCase() : "";

  // ---------------------------------------------------------------- eventos
  if (params.get("q")) $("q").value = params.get("q");
  // /buscar?art=<codigo>: abrir directo la ficha (links desde Inicio, Cotizaciones o compartidos)
  if (params.get("art")) {
    seleccion = params.get("art");
    anotarReciente(seleccion);
    if (!window.matchMedia("(min-width: 960px)").matches) {
      history.replaceState(null, "", location.pathname + location.search);
      history.pushState({ ficha: seleccion }, "", "#art=" + encodeURIComponent(seleccion));
      $("busqueda").classList.add("viendo-ficha");
    }
  }
  HT.conectarBuscador($("q"), $("limpiar"), () => {
    // Una busqueda nueva vuelve a la lista de resultados (en el celular)
    seleccion = null;
    mostrar = PAGINA;
    recientesVista = leerRecientes();
    $("busqueda").classList.remove("viendo-ficha");
    if (location.hash.startsWith("#art=")) history.replaceState(null, "", location.pathname + location.search);
    render();
  });
  selOrden.addEventListener("change", () => { orden = selOrden.value; mostrar = PAGINA; render(); });
  $("actualizar").addEventListener("click", () => { preciosArt.clear(); cotizArt.clear(); movsArt.clear(); cargar(true); });
  window.addEventListener("popstate", () => {
    if (!location.hash.startsWith("#art=")) $("busqueda").classList.remove("viendo-ficha");
  });
  if (location.hash.startsWith("#art=") && !params.get("art")) history.replaceState(null, "", location.pathname + location.search);
  // "/" enfoca el buscador desde cualquier lado (como en muchas webs)
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")) {
      e.preventDefault(); $("q").focus(); $("q").select();
    }
  });
  render();
  cargar(false);
})();
</script>
</body>
</html>
