<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Listas de precios | Herramienta Tango</title>
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/comun.css">
<style>
  /* Barra de edicion */
  .edicion { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin: 0 0 12px; font-size: .88rem; color: var(--plomo); }
  .edicion .quien { color: var(--patina); font-weight: 600; }
  .edicion .acciones { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Listas */
  .listas { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .lista a { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; color: inherit; text-decoration: none; height: 100%; }
  .lista a:hover { border-color: var(--patina); }
  .lista .nombre { font-weight: 650; font-size: 1.05rem; overflow-wrap: anywhere; }
  .lista .cant { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: .82rem; color: var(--plomo); line-height: 1.2; }
  .lista .cant b { display: block; font-size: 1.35rem; color: var(--grafito); font-variant-numeric: tabular-nums; }
  .lista .quien { grid-column: 1; font-size: .84rem; color: var(--plomo); overflow-wrap: anywhere; }

  /* Una lista */
  .detalle { max-width: 960px; }
  .cab-lista { padding: 16px 18px; margin-bottom: 12px; }
  .cab-lista .nombre { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .cab-lista p { margin: 4px 0 0; font-size: .88rem; color: var(--plomo); }
  .cab-lista .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .agregar { padding: 14px 18px; margin-bottom: 12px; }
  .agregar h3 { font-size: .95rem; margin: 0 0 8px; }
  .agregar-fila { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; align-items: start; }
  .sugerencias { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--linea); border-radius: 8px; max-height: 260px; overflow-y: auto; }
  .sugerencias button { width: 100%; text-align: left; font: inherit; font-size: .9rem; background: var(--papel); border: 0; padding: 8px 12px; cursor: pointer; }
  .sugerencias li + li button { border-top: 1px solid var(--linea-suave); }
  .sugerencias button:hover, .sugerencias button:focus-visible { background: var(--patina-suave); }
  .sugerencias small { color: var(--plomo); margin-right: 8px; }
  .elegido { font-size: .9rem; padding: 8px 0 0; }

  .renglones { list-style: none; margin: 0; padding: 0; }
  .renglon { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; padding: 11px 18px; align-items: center; }
  .renglon + .renglon { border-top: 1px solid var(--linea-suave); }
  .renglon .cod { font-size: .8rem; color: var(--plomo); font-variant-numeric: tabular-nums; }
  .renglon .desc { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .renglon .valor { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-weight: 700; font-size: 1.1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .renglon .valor.cero { color: var(--plomo); font-weight: 500; font-size: .9rem; }
  .renglon .meta { grid-column: 1 / -1; font-size: .78rem; color: var(--plomo); }
  .renglon .botones { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
  .renglon.editando { background: #F6FBFA; }
  .editor-precio { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .editor-precio .campo { width: 150px; }
  .editor-precio .cambio { font-size: .9rem; }
  .editor-precio .cambio b { font-variant-numeric: tabular-nums; }

  /* Registro de cambios */
  .cambios { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto; }
  .cambios li { padding: 8px 0; border-top: 1px solid var(--linea-suave); font-size: .88rem; }
  .cambios li:first-child { border-top: 0; }
  .cambios small { display: block; color: var(--plomo); }
  .radios { display: flex; gap: 16px; margin-top: 4px; }
  .radios label { display: flex; align-items: center; gap: 6px; }

  @media (max-width: 600px) {
    .agregar-fila { grid-template-columns: 1fr 1fr; }
    .agregar-fila .campo-art { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1><a class="volver-lista" id="volver" href="#" hidden style="display:block;font-size:.85rem;font-weight:600;color:var(--patina);text-decoration:none;margin-bottom:2px;letter-spacing:0">‹ Listas</a><span id="titulo">Listas de precios</span></h1>
          <div class="datos"><span id="estado">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="edicion" id="edicion"></div>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar</label>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="Lista o cliente" enterkeyhint="search">
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
      </div>

      <main id="resultados" aria-live="polite"></main>

      <p class="pie" id="pie">Los precios se leen directo de las tablas de precios de Tango.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script>
(() => {
  "use strict";
  HT.iniciar("precios");
  const { $, el, norm, sinCeros, tokens, fmt, fmtPrecio, fecha, pedir, textoError, cajaError } = HT;
  const ui = { q: $("q"), limpiar: $("limpiar"), resultados: $("resultados"), estado: $("estado"),
               titulo: $("titulo"), volver: $("volver"), edicion: $("edicion") };
  const MAX_FILAS = 150;

  let listas = [];          // resumen de todas las listas
  let actual = null;        // lista abierta: {lista, cliente, renglones, especiales_leidos}
  let articulos = null;     // para agregar: se cargan la primera vez
  let editando = null;      // id del renglon que se esta editando

  // ---------------------------------------------------------------- perfiles (comun.js)
  const puedeEditar = () => { const u = HT.usuario(); return !!(u && !u.debe_cambiar); };
  const escribir = HT.escribir;
  const ventana = HT.ventana;

  function dibujarEdicion() {
    const c = ui.edicion;
    c.replaceChildren();
    const u = HT.usuario();
    const texto = el("span");
    const acc = el("div", "acciones");
    const ver = el("button", "boton chico", "Ver cambios"); ver.type = "button"; ver.addEventListener("click", verCambios);
    if (puedeEditar()) {
      texto.append("Modificando como ", el("span", "quien", u.nombre), ". Cada cambio queda registrado.");
    } else if (u) {
      const b = el("button", "boton chico", "Elegí tu clave para modificar"); b.type = "button";
      b.addEventListener("click", () => HT.cambiarClave(true));
      acc.append(b);
    } else {
      const b = el("button", "boton chico", "Entrar para modificar"); b.type = "button";
      b.addEventListener("click", () => HT.entrar());
      acc.append(b);
    }
    acc.append(ver);
    c.append(texto, acc);
  }
  HT.alCambiarSesion(() => { editando = null; dibujarEdicion(); render(); });

  async function verCambios() {
    ventana("Cambios hechos desde la Herramienta", async (d, cerrar) => {
      const ul = el("ul", "cambios");
      ul.append(el("li", "", "Cargando…"));
      const acc = el("div", "acciones");
      const b = el("button", "boton", "Cerrar"); b.type = "button"; b.addEventListener("click", cerrar);
      acc.append(b);
      d.append(ul, acc);
      try {
        const { datos } = await pedir("/api/precios/cambios", true);
        ul.replaceChildren();
        if (!datos.length) ul.append(el("li", "", "Todavía no se hizo ningún cambio."));
        for (const c of datos.slice(0, 100)) {
          const li = el("li");
          li.append(describirCambio(c));
          li.append(el("small", "", `${c.quien} · ${new Date(c.fecha).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" })}`));
          ul.append(li);
        }
      } catch (e) { ul.replaceChildren(el("li", "", textoError(e))); }
    });
  }

  const precioDe = r => r && (r.especiales && r.especiales.length ? r.especiales[0].precio : r.precio);
  function describirCambio(c) {
    const art = c.articulo ? ` ${c.articulo}` : "";
    const p = x => x == null ? "—" : fmtPrecio.format(x);
    if (c.accion === "cambiar precio") return `${c.lista}:${art} de ${p(precioDe(c.antes))} a ${p(precioDe(c.despues))}`;
    if (c.accion === "agregar artículo") return `${c.lista}: se agregó${art} a ${p(precioDe(c.despues))}`;
    if (c.accion === "quitar artículo") return `${c.lista}: se quitó${art} (estaba a ${p(precioDe(c.antes))})`;
    if (c.accion === "crear lista") return `Se creó la lista ${c.lista} (número ${c.numero}, ${c.moneda})`;
    if (c.accion === "eliminar lista") return `Se eliminó la lista ${c.lista} con ${c.articulos} artículos`;
    return `${c.accion} ${c.lista || ""}`;
  }

  // ---------------------------------------------------------------- datos
  async function cargarListas(forzar) {
    ui.resultados.classList.add("cargando");
    ui.estado.textContent = "Consultando Tango…";
    try {
      const d = await pedir("/api/listas", forzar);
      listas = d.datos;
      ui.estado.textContent = "Datos de Tango de las " + HT.hora(new Date(d.actualizado)) + " h";
    } catch (e) {
      ui.estado.textContent = "Sin datos";
      ui.resultados.replaceChildren(cajaError(textoError(e), () => cargarListas(true)));
      return;
    } finally { ui.resultados.classList.remove("cargando"); }
    render();
  }

  async function abrirLista(id, forzar) {
    ui.resultados.classList.add("cargando");
    if (!actual || actual.lista.id !== id) ui.resultados.replaceChildren(el("p", "aviso", "Cargando la lista…"));
    try {
      const d = await pedir("/api/listas/" + id, forzar);
      actual = d.datos;
      ui.estado.textContent = "Datos de Tango de las " + HT.hora(new Date(d.actualizado)) + " h";
    } catch (e) {
      ui.resultados.replaceChildren(cajaError(textoError(e), () => abrirLista(id, true)));
      return;
    } finally { ui.resultados.classList.remove("cargando"); }
    render();
  }

  const idDelHash = () => { const m = location.hash.match(/^#lista=(\d+)/); return m ? Number(m[1]) : null; };

  // ---------------------------------------------------------------- dibujo
  function render() {
    ui.limpiar.hidden = !ui.q.value;
    const id = idDelHash();
    if (id) {
      ui.volver.hidden = false;
      ui.q.placeholder = "Buscar artículo en esta lista";
      if (!actual || actual.lista.id !== id) { ui.titulo.textContent = "Lista"; return; }
      ui.titulo.textContent = actual.lista.nombre;
      dibujarLista();
    } else {
      ui.volver.hidden = true;
      ui.titulo.textContent = "Listas de precios";
      ui.q.placeholder = "Lista o cliente";
      dibujarListas();
    }
  }

  function dibujarListas() {
    const ts = tokens(ui.q.value);
    const frag = document.createDocumentFragment();
    const ls = listas.filter(l => ts.every(t => norm(l.nombre + " " + l.numero + " " + l.clientes_asignados.join(" ")).includes(t)));
    const cab = el("div", "edicion");
    cab.append(el("p", "resumen", ts.length ? `${ls.length} de ${listas.length} listas` : `${listas.length} listas`));
    if (HT.esAdmin() && puedeEditar()) {
      const b = el("button", "boton chico primario", "Nueva lista"); b.type = "button"; b.addEventListener("click", nuevaLista);
      cab.append(b);
    }
    frag.append(cab);
    if (ls.length) {
      const ul = el("ul", "listas");
      for (const l of ls) {
        const li = el("li", "lista");
        const a = el("a"); a.href = "#lista=" + l.id;
        const q = l.clientes_asignados;
        a.append(el("span", "nombre", l.nombre),
          el("span", "quien", `Lista ${l.numero} · ${l.moneda === "$" ? "pesos" : "dólares"}` +
            (q.length ? ` · ${q.length === 1 ? q[0] : q.length + " clientes"}` : "")));
        const c = el("span", "cant"); c.append(el("b", "", fmt.format(l.articulos)), l.articulos === 1 ? "artículo" : "artículos");
        a.append(c); li.append(a); ul.append(li);
      }
      frag.append(ul);
    } else {
      const a = el("div", "aviso");
      const p = el("p"); p.append("Ninguna lista coincide con ", el("strong", "", `«${ui.q.value.trim()}»`), ".");
      const p2 = el("p"); const link = el("a", "", "Buscar ese artículo");
      link.href = "/?q=" + encodeURIComponent(ui.q.value.trim()); link.style.color = "var(--patina)";
      p2.append("Si buscás el precio de un artículo en todas las listas: ", link, ".");
      a.append(p, p2); frag.append(a);
    }
    ui.resultados.replaceChildren(frag);
  }

  // Precio que se muestra de un renglon: el especial del cliente de la lista, o el de lista
  function precioMostrado(r) {
    const dueno = actual.cliente;
    const esp = (r.especiales || []).find(e => dueno && e.id_cliente === dueno.id);
    return esp ? { precio: esp.precio, cliente: esp.id_cliente } : { precio: r.precio, cliente: null };
  }

  function dibujarLista() {
    const l = actual.lista;
    const frag = document.createDocumentFragment();
    const d = el("div", "detalle");
    const cab = el("div", "tarjeta cab-lista");
    cab.append(el("div", "nombre", l.nombre));
    const cli = actual.cliente;
    cab.append(el("p", "", `Lista ${l.numero} · ${l.moneda === "$" ? "pesos" : "dólares"} · ${fmt.format(actual.renglones.length)} artículos`));
    cab.append(el("p", "", cli ? `Precios para ${cli.razon_social || cli.codigo} (precio especial del cliente)` : "Precios de lista, iguales para todos los clientes que la usen."));
    if (HT.esAdmin() && puedeEditar()) {
      const acc = el("div", "acciones");
      const b = el("button", "boton chico peligro", "Eliminar lista"); b.type = "button"; b.addEventListener("click", eliminarLista);
      acc.append(b); cab.append(acc);
    }
    d.append(cab);
    if (puedeEditar()) d.append(formAgregar());

    const ts = tokens(ui.q.value);
    const filas = ts.length ? actual.renglones.filter(r => {
      const txt = norm(r.codigo_articulo + " " + r.descripcion);
      return ts.every(t => txt.includes(t) || sinCeros(norm(r.codigo_articulo)).includes(sinCeros(t)));
    }) : actual.renglones;
    if (!filas.length) {
      d.append(el("p", "aviso", actual.renglones.length ? "Ningún artículo de la lista coincide con la búsqueda." : "La lista todavía no tiene artículos."));
    } else {
      const ul = el("ul", "renglones tarjeta");
      for (const r of filas.slice(0, MAX_FILAS)) ul.append(filaRenglon(r));
      d.append(ul);
      if (filas.length > MAX_FILAS) d.append(el("p", "mas", `Se muestran ${MAX_FILAS} de ${fmt.format(filas.length)}. Escribí para buscar un artículo.`));
    }
    if (!actual.especiales_leidos) d.append(el("p", "pie", "Lista muy grande: se muestran los precios de lista, sin los precios especiales por cliente."));
    frag.append(d);
    ui.resultados.replaceChildren(frag);
  }

  function filaRenglon(r) {
    const li = el("li", "renglon" + (editando === r.id ? " editando" : ""));
    li.append(el("span", "cod", r.codigo_articulo), el("span", "desc", r.descripcion || "(sin descripción)"));
    const m = precioMostrado(r);
    const v = el("span", "valor" + (m.precio > 0 ? "" : " cero"));
    if (m.precio > 0) v.append(el("span", "moneda", actual.lista.moneda), fmtPrecio.format(m.precio));
    else v.textContent = "Sin precio";
    li.append(v);
    const otros = (r.especiales || []).filter(e => e.id_cliente !== m.cliente);
    if (otros.length) li.append(el("span", "meta", "También: " + otros.map(e => `${e.codigo_cliente} ${fmtPrecio.format(e.precio)}`).join(", ")));
    if (puedeEditar()) {
      if (editando === r.id) li.append(editorPrecio(r, m));
      else {
        const b = el("div", "botones");
        const cambiar = el("button", "boton chico", "Cambiar precio"); cambiar.type = "button";
        cambiar.addEventListener("click", () => { editando = r.id; render(); setTimeout(() => { const c = document.querySelector(".editor-precio .campo"); c && c.focus(); }, 30); });
        const quitar = el("button", "boton chico peligro", "Quitar"); quitar.type = "button";
        let hasta = 0;
        quitar.addEventListener("click", async () => {
          if (Date.now() > hasta) { hasta = Date.now() + 4000; quitar.classList.add("confirmar"); quitar.textContent = "¿Quitar de la lista? Tocá de nuevo";
            setTimeout(() => { quitar.classList.remove("confirmar"); quitar.textContent = "Quitar"; }, 4000); return; }
          quitar.disabled = true; quitar.textContent = "Quitando…";
          try { await escribir("/api/precios/quitar", { renglon: r.id }); await abrirLista(actual.lista.id, true); }
          catch (e) { alertar(li, e.message); quitar.disabled = false; quitar.textContent = "Quitar"; }
        });
        b.append(cambiar, quitar); li.append(b);
      }
    }
    return li;
  }

  function alertar(contenedor, texto) {
    contenedor.querySelectorAll(".mensaje-error").forEach(x => x.remove());
    const p = el("p", "mensaje-error", texto); p.style.gridColumn = "1 / -1";
    contenedor.append(p);
  }

  // "1.234,56" o "1234,56" (coma decimal) o "1234.56" (punto decimal, si no hay coma)
  const leerPrecio = t => {
    const x = String(t).trim();
    const n = Number(x.includes(",") ? x.replace(/\./g, "").replace(",", ".") : x);
    return x && Number.isFinite(n) ? n : NaN;
  };

  function editorPrecio(r, m) {
    const caja = el("div", "editor-precio");
    const campo = el("input", "campo"); campo.inputMode = "decimal"; campo.value = m.precio ? String(m.precio).replace(".", ",") : "";
    campo.setAttribute("aria-label", "Precio nuevo");
    const cambio = el("span", "cambio");
    const guardar = el("button", "boton chico primario", "Guardar"); guardar.type = "button";
    const cancelar = el("button", "boton chico", "Cancelar"); cancelar.type = "button";
    const mostrar = () => {
      const n = leerPrecio(campo.value);
      cambio.replaceChildren();
      if (Number.isNaN(n) || n < 0) { cambio.textContent = "Escribí un precio válido."; guardar.disabled = true; return; }
      guardar.disabled = n === m.precio;
      cambio.append(el("b", "", fmtPrecio.format(m.precio)), " → ", el("b", "", fmtPrecio.format(n)));
    };
    campo.addEventListener("input", mostrar);
    campo.addEventListener("keydown", e => { if (e.key === "Enter" && !guardar.disabled) guardar.click(); if (e.key === "Escape") cancelar.click(); });
    cancelar.addEventListener("click", () => { editando = null; render(); });
    guardar.addEventListener("click", async () => {
      guardar.disabled = true; guardar.textContent = "Guardando…";
      try {
        await escribir("/api/precios/cambiar", { renglon: r.id, precio: leerPrecio(campo.value), cliente: m.cliente });
        editando = null; await abrirLista(actual.lista.id, true);
      } catch (e) { alertar(caja, e.message); guardar.disabled = false; guardar.textContent = "Guardar"; }
    });
    caja.append(campo, cambio, guardar, cancelar);
    mostrar();
    return caja;
  }

  function formAgregar() {
    const t = el("div", "tarjeta agregar");
    t.append(el("h3", "", "Agregar artículo"));
    const fila = el("div", "agregar-fila");
    const art = el("input", "campo campo-art"); art.placeholder = "Código o descripción"; art.autocomplete = "off"; art.setAttribute("aria-label", "Artículo");
    const precio = el("input", "campo"); precio.placeholder = "Precio"; precio.inputMode = "decimal"; precio.setAttribute("aria-label", "Precio");
    const boton = el("button", "boton primario", "Agregar"); boton.type = "button"; boton.disabled = true;
    fila.append(art, precio, boton);
    const sug = el("ul", "sugerencias"); sug.hidden = true;
    const elegido = el("div", "elegido"); elegido.hidden = true;
    let codigo = null;
    const yaEsta = new Set(actual.renglones.map(r => r.codigo_articulo));
    const habilitar = () => { const n = leerPrecio(precio.value); boton.disabled = !codigo || Number.isNaN(n) || n < 0 || precio.value.trim() === ""; };
    art.addEventListener("focus", async () => {
      if (articulos) return;
      try { articulos = (await pedir("/api/articulos")).datos.map(a => ({ ...a, _t: norm(a.codigo + " " + a.descripcion) })); }
      catch (e) { alertar(t, textoError(e)); }
    });
    art.addEventListener("input", () => {
      codigo = null; elegido.hidden = true; habilitar();
      const ts = tokens(art.value);
      sug.replaceChildren();
      if (!ts.length || !articulos) { sug.hidden = true; return; }
      const res = articulos.filter(a => ts.every(x => a._t.includes(x))).slice(0, 30);
      for (const a of res) {
        const li = el("li"); const b = el("button"); b.type = "button";
        b.append(el("small", "", a.codigo), a.descripcion + (yaEsta.has(a.codigo) ? " (ya está en la lista)" : ""));
        b.disabled = yaEsta.has(a.codigo);
        b.addEventListener("click", () => {
          codigo = a.codigo; art.value = a.codigo + " " + a.descripcion; sug.hidden = true;
          elegido.hidden = true; habilitar(); precio.focus();
        });
        li.append(b); sug.append(li);
      }
      sug.hidden = !res.length;
    });
    precio.addEventListener("input", habilitar);
    precio.addEventListener("keydown", e => { if (e.key === "Enter" && !boton.disabled) boton.click(); });
    boton.addEventListener("click", async () => {
      boton.disabled = true; boton.textContent = "Agregando…";
      try {
        const cli = actual.cliente;
        await escribir("/api/precios/agregar", { lista: actual.lista.id, articulo: codigo, precio: leerPrecio(precio.value),
                                                 cliente: cli ? cli.id : null, codigo_cliente: cli ? cli.codigo : "" });
        await abrirLista(actual.lista.id, true);
      } catch (e) { alertar(t, e.message); boton.disabled = false; boton.textContent = "Agregar"; }
    });
    t.append(fila, sug, elegido);
    return t;
  }

  function nuevaLista() {
    ventana("Nueva lista de precios", (d, cerrar) => {
      const f = el("form");
      const n = el("input", "campo"); n.id = "nl-nombre"; n.maxLength = 20; n.required = true;
      const ln = el("label", "etiqueta", "Nombre (hasta 20 letras; por ejemplo el del cliente)"); ln.htmlFor = "nl-nombre";
      const lm = el("span", "etiqueta", "Moneda");
      const radios = el("div", "radios");
      for (const [v, t, ch] of [["US$", "Dólares", true], ["$", "Pesos", false]]) {
        const lab = el("label"); const r = el("input"); r.type = "radio"; r.name = "moneda"; r.value = v; r.checked = ch;
        lab.append(r, t); radios.append(lab);
      }
      const sig = Math.max(0, ...listas.map(l => l.numero || 0)) + 1;
      const nro = el("input", "campo"); nro.id = "nl-numero"; nro.inputMode = "numeric"; nro.placeholder = String(sig);
      const lnro = el("label", "etiqueta", "Número de lista (si lo dejás vacío, " + sig + ")"); lnro.htmlFor = "nl-numero";
      const nota = el("p", "", "Para que un cliente la use, después asignásela en su ficha en Tango (campo Lista de precios).");
      const err = el("p", "mensaje-error"); err.hidden = true;
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cancelar"); c.type = "button"; c.addEventListener("click", cerrar);
      const ok = el("button", "boton primario", "Crear lista"); ok.type = "submit";
      acc.append(c, ok);
      f.append(ln, n, lm, radios, lnro, nro, nota, err, acc);
      f.addEventListener("submit", async e => {
        e.preventDefault(); ok.disabled = true; err.hidden = true;
        try {
          const res = await escribir("/api/listas/crear", { nombre: n.value, moneda: f.moneda.value,
                                                            numero: nro.value.trim() ? Number(nro.value) : null });
          cerrar();
          await cargarListas(true);
          location.hash = "lista=" + res.datos.id;
        } catch (ex) { err.textContent = ex.message; err.hidden = false; ok.disabled = false; }
      });
      d.append(f);
      setTimeout(() => n.focus(), 50);
    });
  }

  function eliminarLista() {
    const l = actual.lista;
    ventana("Eliminar la lista " + l.nombre, (d, cerrar) => {
      d.append(el("p", "", `Se quitan sus ${actual.renglones.length} artículos y se borra la lista de Tango. Lo que tenía queda guardado en el registro de cambios.`));
      const f = el("form");
      const n = el("input", "campo"); n.id = "el-nombre"; n.autocomplete = "off";
      const ln = el("label", "etiqueta", `Para confirmar, escribí ${l.nombre}`); ln.htmlFor = "el-nombre";
      const err = el("p", "mensaje-error"); err.hidden = true;
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cancelar"); c.type = "button"; c.addEventListener("click", cerrar);
      const ok = el("button", "boton peligro confirmar", "Eliminar lista"); ok.type = "submit"; ok.disabled = true;
      n.addEventListener("input", () => { ok.disabled = norm(n.value) !== norm(l.nombre); });
      acc.append(c, ok);
      f.append(ln, n, err, acc);
      f.addEventListener("submit", async e => {
        e.preventDefault(); ok.disabled = true; ok.textContent = "Eliminando…"; err.hidden = true;
        try {
          await escribir("/api/listas/eliminar", { lista: l.id, confirmar: n.value });
          cerrar(); actual = null; location.hash = ""; await cargarListas(true);
        } catch (ex) { err.textContent = ex.message; err.hidden = false; ok.disabled = false; ok.textContent = "Eliminar lista"; }
      });
      d.append(f);
      setTimeout(() => n.focus(), 50);
    });
  }

  // ---------------------------------------------------------------- eventos
  HT.conectarBuscador(ui.q, ui.limpiar, render);
  $("actualizar").addEventListener("click", () => { const id = idDelHash(); id ? abrirLista(id, true) : cargarListas(true); });
  ui.volver.addEventListener("click", e => { e.preventDefault(); location.hash = ""; });
  window.addEventListener("hashchange", () => {
    ui.q.value = ""; editando = null; window.scrollTo(0, 0);
    const id = idDelHash();
    if (id) abrirLista(id); else render();
  });

  const inicial = new URLSearchParams(location.search).get("q");
  if (inicial) { ui.q.value = inicial; ui.limpiar.hidden = false; }
  dibujarEdicion();
  cargarListas(false);
  if (idDelHash()) abrirLista(idDelHash());
})();
</script>
</body>
</html>
