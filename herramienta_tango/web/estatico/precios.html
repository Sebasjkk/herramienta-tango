<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Listas de precios | Herramienta Sianco</title>
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/comun.css">
<script>try{var t=localStorage.getItem("ht_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
<style>
  /* Barra de edicion */
  .edicion { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin: 0 0 12px; font-size: .88rem; color: var(--plomo); }
  .edicion .quien { color: var(--patina); font-weight: 600; }
  .edicion .acciones { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Listas */
  .listas { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .lista a { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; color: inherit; text-decoration: none; height: 100%; }
  .lista a:hover { border-color: var(--patina); }
  .lista .nombre { font-weight: 650; font-size: 1.05rem; overflow-wrap: anywhere; }
  .lista .cant { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: .82rem; color: var(--plomo); line-height: 1.2; }
  .lista .cant b { display: block; font-size: 1.35rem; color: var(--grafito); font-variant-numeric: tabular-nums; }
  .lista .quien { grid-column: 1; font-size: .84rem; color: var(--plomo); overflow-wrap: anywhere; }

  /* Una lista */
  .detalle { max-width: 960px; }
  .cab-lista { padding: 16px 18px; margin-bottom: 12px; }
  .cab-lista .nombre { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .cab-lista p { margin: 4px 0 0; font-size: .88rem; color: var(--plomo); }
  .cab-lista .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .agregar { padding: 14px 18px; margin-bottom: 12px; }
  .agregar h3 { font-size: .95rem; margin: 0 0 8px; }
  .agregar-fila { display: grid; grid-template-columns: 1fr 140px auto; gap: 8px; align-items: start; }
  .sugerencias { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--linea); border-radius: 8px; max-height: 260px; overflow-y: auto; }
  .sugerencias button { width: 100%; text-align: left; font: inherit; font-size: .9rem; background: var(--papel); border: 0; padding: 8px 12px; cursor: pointer; }
  .sugerencias li + li button { border-top: 1px solid var(--linea-suave); }
  .sugerencias button:hover, .sugerencias button:focus-visible { background: var(--patina-suave); }
  .sugerencias small { color: var(--plomo); margin-right: 8px; }
  .sugerencias .vacio { padding: 8px 12px; color: var(--plomo); font-size: .9rem; }
  .selector-cliente { margin-bottom: 12px; }
  .elegido { font-size: .9rem; padding: 8px 0 0; }

  .renglones { list-style: none; margin: 0; padding: 0; }
  .renglon { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; padding: 11px 18px; align-items: center; }
  .renglon + .renglon { border-top: 1px solid var(--linea-suave); }
  .renglon .cod { font-size: .8rem; color: var(--plomo); font-variant-numeric: tabular-nums; }
  .renglon .desc { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .renglon .valor { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-weight: 700; font-size: 1.1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .renglon .valor.cero { color: var(--plomo); font-weight: 500; font-size: .9rem; }
  .renglon .meta { grid-column: 1 / -1; font-size: .78rem; color: var(--plomo); }
  .renglon .botones { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
  .renglon.editando { background: var(--seleccion); }
  .editor-precio { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .editor-precio .campo { width: 150px; }
  .editor-precio .cambio { font-size: .9rem; }
  .editor-precio .cambio b { font-variant-numeric: tabular-nums; }

  /* Registro de cambios */
  .cambios { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto; }
  .cambios li { padding: 8px 0; border-top: 1px solid var(--linea-suave); font-size: .88rem; }
  .cambios li:first-child { border-top: 0; }
  .cambios small { display: block; color: var(--plomo); }
  .radios { display: flex; gap: 16px; margin-top: 4px; }
  .radios label { display: flex; align-items: center; gap: 6px; }

  @media (max-width: 600px) {
    .agregar-fila { grid-template-columns: 1fr 1fr; }
    .agregar-fila .campo-art { grid-column: 1 / -1; }
  }
  .restaurar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 6px 0; }
  .copia-lista { margin: 4px 0; padding-left: 18px; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .usos { padding: 10px 18px; margin-top: 10px; }
  .usos summary { cursor: pointer; font-weight: 600; }
  .usos h4 { font-size: .9rem; margin: 10px 0 4px; }
  .usos ul { margin: 0 0 4px; padding-left: 20px; font-size: .9rem; }
  .usos .anio { margin: 2px 0 2px 4px; font-size: .9rem; }
  .usos .anio > summary { font-weight: 400; }
  .usos ul.comprobantes { list-style: none; padding-left: 12px; }
  .usos ul.comprobantes summary { font-weight: 400; overflow-wrap: anywhere; }
  .renglones-comp { width: 100%; border-collapse: collapse; margin: 4px 0 8px; font-size: .85rem; }
  .renglones-comp td { padding: 3px 6px; border-bottom: 1px solid var(--borde, var(--linea)); vertical-align: top; }
  .renglones-comp td.der { text-align: right; white-space: nowrap; }
  .renglones-comp .nota { display: block; }
  .reasignar { border-left: 3px solid var(--oxido); background: var(--oxido-suave); padding: 8px 12px; border-radius: 6px; margin: 4px 0 12px; }
  .reasignar p { margin: 0 0 8px; }
  .reasignar .nota { margin: 8px 0 0; }
  /* Importar desde Excel */
  dialog.ayuda.ancha { max-width: 860px; }
  .imp-resumen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .imp-resumen div { border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; }
  .imp-resumen b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .imp-resumen span { font-size: .8rem; color: var(--plomo); }
  .imp-resumen .mal b { color: var(--oxido); }
  .imp-listas { list-style: none; margin: 8px 0; padding: 0; max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--linea); }
  .imp-listas > li { border-bottom: 1px solid var(--linea-suave); }
  .imp-listas details > summary { cursor: pointer; padding: 8px 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .imp-listas summary b { min-width: 9em; }
  .imp-listas summary small { color: var(--plomo); }
  .imp-listas .err { color: var(--oxido); font-size: .85rem; }
  .imp-renglones { list-style: none; margin: 0 0 8px; padding: 0 0 0 10px; font-size: .84rem; }
  .imp-renglones li { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 8px; padding: 3px 0; border-top: 1px dotted var(--linea-suave); }
  .imp-renglones .est { font-weight: 600; }
  .imp-renglones .agregar .est { color: var(--patina-oscura); }
  .imp-renglones .distinto .est { color: var(--ambar); }
  .imp-renglones .error .est, .imp-renglones .no_cargar .est { color: var(--oxido); }
  .imp-renglones .igual { color: var(--plomo); }
  .imp-renglones small { display: block; color: var(--plomo); }
  .imp-op { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: .92rem; }
  .imp-op input { margin-top: 3px; }
  .avance { height: 10px; background: var(--linea-suave); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .avance > div { height: 100%; background: var(--patina); width: 0; transition: width .3s; }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1><a class="volver-lista" id="volver" href="#" hidden style="display:block;font-size:.85rem;font-weight:600;color:var(--patina);text-decoration:none;margin-bottom:2px;letter-spacing:0">‹ Listas</a><span id="titulo">Listas de precios</span></h1>
          <div class="datos"><span id="estado">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="edicion" id="edicion"></div>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar</label>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="Lista o cliente" enterkeyhint="search">
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
      </div>

      <main id="resultados" aria-live="polite"></main>

      <p class="pie" id="pie">Los precios se leen directo de las tablas de precios de Tango.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script>
(() => {
  "use strict";
  HT.iniciar("precios");
  const { $, el, norm, sinCeros, tokens, fmt, fmtPrecio, fecha, pedir, textoError, cajaError } = HT;
  const ui = { q: $("q"), limpiar: $("limpiar"), resultados: $("resultados"), estado: $("estado"),
               titulo: $("titulo"), volver: $("volver"), edicion: $("edicion") };
  const MAX_FILAS = 150;

  let listas = [];          // resumen de todas las listas
  let actual = null;        // lista abierta: {lista, cliente, renglones, especiales_leidos}
  let articulos = null;     // para agregar: se cargan la primera vez
  let editando = null;      // id del renglon que se esta editando
  let clientes = null;      // para asignar listas: se cargan la primera vez

  // ---------------------------------------------------------------- modificar (sin claves)
  const puedeEditar = () => true;
  const escribir = HT.escribir;
  const ventana = HT.ventana;
  HT.esAdmin = () => true;   // crear y eliminar listas: cualquiera

  function dibujarEdicion() {
    const c = ui.edicion;
    c.replaceChildren();
    const texto = el("span");
    const n = HT.nombre();
    texto.append("Cada cambio queda registrado", n ? " como " : ".", ...(n ? [el("span", "quien", n), "."] : []));
    const acc = el("div", "acciones");
    const nombre = el("button", "boton chico", n ? "Cambiar nombre" : "Poner mi nombre"); nombre.type = "button";
    nombre.addEventListener("click", () => HT.pedirNombre());
    const ver = el("button", "boton chico", "Ver cambios"); ver.type = "button"; ver.addEventListener("click", verCambios);
    acc.append(nombre, ver);
    c.append(texto, acc);
  }
  HT.alCambiarNombre(dibujarEdicion);

  async function verCambios() {
    ventana("Cambios hechos desde la Herramienta", async (d, cerrar) => {
      const ul = el("ul", "cambios");
      ul.append(el("li", "", "Cargando…"));
      const acc = el("div", "acciones");
      const b = el("button", "boton", "Cerrar"); b.type = "button"; b.addEventListener("click", cerrar);
      acc.append(b);
      d.append(ul, acc);
      try {
        const { datos } = await pedir("/api/precios/cambios", true);
        ul.replaceChildren();
        if (!datos.length) ul.append(el("li", "", "Todavía no se hizo ningún cambio."));
        for (const c of datos.slice(0, 100)) {
          const li = el("li");
          li.append(describirCambio(c));
          if (c.contenido && c.contenido.length) {
            // Lo que tenia la lista al eliminarla, para poder volver a cargarlo
            const det = el("details"); det.append(el("summary", "", `Ver los ${c.contenido.length} artículos que tenía`));
            const t = el("ul", "copia-lista");
            const fp = v => v == null ? "—" : fmtPrecio.format(v);
            for (const x of c.contenido) {
              const esp = (x.especiales || []).map(e => `${e.cliente || "cliente"} ${fp(e.precio)}`).join(", ");
              t.append(el("li", "", `${x.articulo}: ${fp(x.precio)}${esp ? " · especial " + esp : ""}`));
            }
            det.append(t); li.append(det);
            if (c.accion === "eliminar lista") li.append(botonRestaurar(c));
          }
          li.append(el("small", "", `${c.quien} · ${new Date(c.fecha).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" })}`));
          ul.append(li);
        }
      } catch (e) { ul.replaceChildren(el("li", "", textoError(e))); }
    });
  }

  // Volver a cargar una lista eliminada desde su copia (corre en el servidor)
  function botonRestaurar(c) {
    const caja = el("div", "restaurar");
    const b = el("button", "boton chico", `Restaurar los ${c.contenido.length} artículos en ${c.lista}`); b.type = "button";
    const txt = el("span", "nota");
    caja.append(b, txt);
    const seguir = async () => {
      while (document.body.contains(caja)) {
        let e;
        try { e = (await pedir("/api/listas/restaurar/estado", true)).datos; } catch { await new Promise(r => setTimeout(r, 2000)); continue; }
        if (e.lista !== c.lista) return;
        txt.textContent = e.corriendo ? ` Restaurando: ${e.hechos} de ${e.total}…`
          : ` Listo: ${e.hechos - e.errores.length} cargados${e.ya_estaban ? `, ${e.ya_estaban} ya estaban` : ""}` +
            (e.errores.length ? `, ${e.errores.length} con error (${e.errores.slice(0, 3).map(x => `${x.articulo}: ${x.error}`).join("; ")})` : "") + ".";
        if (!e.corriendo) { b.disabled = false; cargarListas(true); return; }
        await new Promise(r => setTimeout(r, 1500));
      }
    };
    b.addEventListener("click", async () => {
      if (!confirm(`¿Volver a cargar en ${c.lista} los ${c.contenido.length} artículos que tenía? Los que ya estén en la lista se saltean.`)) return;
      b.disabled = true; txt.textContent = " Empezando…";
      try { await escribir("/api/listas/restaurar", { fecha: c.fecha, lista: c.lista }); seguir(); }
      catch (e) { txt.textContent = " " + e.message; b.disabled = false; }
    });
    return caja;
  }

  const precioDe = r => r && (r.especiales && r.especiales.length ? r.especiales[0].precio : r.precio);
  function describirCambio(c) {
    const art = c.articulo ? ` ${c.articulo}` : "";
    const p = x => x == null ? "—" : fmtPrecio.format(x);
    if (c.accion === "cambiar precio") return `${c.lista}:${art} de ${p(precioDe(c.antes))} a ${p(precioDe(c.despues))}`;
    if (c.accion === "agregar artículo") return `${c.lista}: se agregó${art} a ${p(precioDe(c.despues))}`;
    if (c.accion === "quitar artículo") return `${c.lista}: se quitó${art} (estaba a ${p(precioDe(c.antes))})`;
    if (c.accion === "crear lista") return `Se creó la lista ${c.lista} (número ${c.numero}, ${c.moneda})`;
    if (c.accion === "eliminar lista") return `Lista ${c.lista} eliminada (copia de sus ${c.articulos} artículos guardada)`;
    if (c.accion === "error al eliminar lista") return `No se pudo eliminar la lista ${c.lista}: ${c.error}`;
    if (c.accion === "asignar lista") return `${c.razon_social || c.cliente}: pasó de la lista ${c.lista_anterior} a ${c.lista}`;
    return `${c.accion} ${c.lista || ""}`;
  }

  // ---------------------------------------------------------------- datos
  async function cargarListas(forzar) {
    ui.resultados.classList.add("cargando");
    ui.estado.textContent = "Consultando Tango…";
    try {
      const d = await pedir("/api/listas", forzar);
      listas = d.datos;
      ui.estado.textContent = "Datos de Tango de las " + HT.hora(new Date(d.actualizado)) + " h";
    } catch (e) {
      ui.estado.textContent = "Sin datos";
      ui.resultados.replaceChildren(cajaError(e, () => cargarListas(true)));
      return;
    } finally { ui.resultados.classList.remove("cargando"); }
    render();
  }

  async function abrirLista(id, forzar) {
    ui.resultados.classList.add("cargando");
    if (!actual || actual.lista.id !== id) ui.resultados.replaceChildren(el("p", "aviso", "Cargando la lista…"));
    try {
      const d = await pedir("/api/listas/" + id, forzar);
      actual = d.datos;
      ui.estado.textContent = "Datos de Tango de las " + HT.hora(new Date(d.actualizado)) + " h";
    } catch (e) {
      ui.resultados.replaceChildren(cajaError(e, () => abrirLista(id, true)));
      return;
    } finally { ui.resultados.classList.remove("cargando"); }
    render();
  }

  const idDelHash = () => { const m = location.hash.match(/^#lista=(\d+)/); return m ? Number(m[1]) : null; };

  // ---------------------------------------------------------------- dibujo
  function render() {
    ui.limpiar.hidden = !ui.q.value;
    const id = idDelHash();
    if (id) {
      ui.volver.hidden = false;
      ui.q.placeholder = "Buscar artículo en esta lista";
      if (!actual || actual.lista.id !== id) { ui.titulo.textContent = "Lista"; return; }
      ui.titulo.textContent = actual.lista.nombre;
      dibujarLista();
    } else {
      ui.volver.hidden = true;
      ui.titulo.textContent = "Listas de precios";
      ui.q.placeholder = "Lista o cliente";
      dibujarListas();
    }
  }

  function dibujarListas() {
    const ts = tokens(ui.q.value);
    const frag = document.createDocumentFragment();
    const ls = listas.filter(l => ts.every(t => norm(l.nombre + " " + l.numero + " " + l.clientes_asignados.join(" ")).includes(t)));
    const cab = el("div", "edicion");
    cab.append(el("p", "resumen", ts.length ? `${ls.length} de ${listas.length} listas` : `${listas.length} listas`));
    if (HT.esAdmin() && puedeEditar()) {
      const imp = el("button", "boton chico", "Importar Excel"); imp.type = "button"; imp.addEventListener("click", importarExcel);
      const b = el("button", "boton chico primario", "Nueva lista"); b.type = "button"; b.addEventListener("click", nuevaLista);
      cab.append(imp, b);
    }
    frag.append(cab);
    if (ls.length) {
      const ul = el("ul", "listas");
      for (const l of ls) {
        const li = el("li", "lista");
        const a = el("a"); a.href = "#lista=" + l.id;
        const q = l.clientes_asignados;
        a.append(el("span", "nombre", l.nombre),
          el("span", "quien", `Lista ${l.numero} · ${l.moneda === "$" ? "pesos" : "dólares"}` +
            (q.length ? ` · ${q.length === 1 ? q[0] : q.length + " clientes"}` : "")));
        const c = el("span", "cant"); c.append(el("b", "", fmt.format(l.articulos)), l.articulos === 1 ? "artículo" : "artículos");
        a.append(c); li.append(a); ul.append(li);
      }
      frag.append(ul);
    } else {
      const a = el("div", "aviso");
      const p = el("p"); p.append("Ninguna lista coincide con ", el("strong", "", `«${ui.q.value.trim()}»`), ".");
      const p2 = el("p"); const link = el("a", "", "Buscar ese artículo");
      link.href = "/buscar?q=" + encodeURIComponent(ui.q.value.trim()); link.style.color = "var(--patina)";
      p2.append("Si buscás el precio de un artículo en todas las listas: ", link, ".");
      a.append(p, p2); frag.append(a);
    }
    ui.resultados.replaceChildren(frag);
  }

  // Precio que se muestra de un renglon: el especial del cliente de la lista, o el de lista
  function precioMostrado(r) {
    const dueno = actual.cliente;
    const esp = (r.especiales || []).find(e => dueno && e.id_cliente === dueno.id);
    return esp ? { precio: esp.precio, cliente: esp.id_cliente } : { precio: r.precio, cliente: null };
  }

  // Donde se usa la lista: clientes y pedidos (API), cotizaciones y facturas (base de Tango, solo lectura)
  function seccionUsos(l) {
    const s = el("details", "tarjeta usos");
    const sum = el("summary", "", "Dónde se usa");
    const cuerpo = el("div"); cuerpo.append(el("p", "nota", "Consultando Tango…"));
    s.append(sum, cuerpo);
    let cargado = false;
    s.addEventListener("toggle", async () => {
      if (!s.open || cargado) return;
      cargado = true;
      try {
        const u = (await pedir(`/api/listas/${l.id}/usos`, true)).datos;
        cuerpo.replaceChildren();
        cuerpo.append(el("h4", "", `Clientes que la tienen asignada: ${u.clientes.length}`));
        if (u.clientes.length) {
          const ul = el("ul"); for (const c of u.clientes) ul.append(el("li", "", `${c.razon_social} (${c.codigo})`)); cuerpo.append(ul);
        }
        cuerpo.append(el("h4", "", `Pedidos: ${u.pedidos.length}`));
        if (u.pedidos.length) {
          const ul = el("ul");
          for (const p of u.pedidos) {
            const li = el("li"); const a = el("a", "", `Pedido ${p.numero}`); a.href = "/pedidos";
            li.append(a, ` · ${p.cliente} · ${fecha(p.fecha)} · ${p.estado}`); ul.append(li);
          }
          cuerpo.append(ul);
        }
        if (u.base_error) {
          cuerpo.append(el("h4", "", "Cotizaciones y facturas"));
          cuerpo.append(el("p", "mensaje-error", u.base_error));
          if (/permiso/i.test(u.base_error))
            cuerpo.append(el("p", "nota", "La Herramienta lee estos datos directo de la base de Tango (solo lectura). " +
              "Hay que darle permiso de lectura una vez, en el servidor. Pedíselo a quien administra el servidor."));
        } else {
          const cot = u.cotizaciones || [], hoy = new Date().toISOString().slice(0, 10);
          cuerpo.append(el("h4", "", `Cotizaciones: ${u.cotizaciones_total}`));
          if (cot.length) {
            const ul = el("ul");
            for (const q of cot) {
              const vig = q.vigencia && q.vigencia >= hoy ? `vigente hasta ${fecha(q.vigencia)}` : (q.vigencia ? `venció el ${fecha(q.vigencia)}` : "");
              const li = el("li", "", [`Cotización ${String(q.numero).replace(/^0+/, "")}`, q.cliente || q.codigo_cliente, fecha(q.fecha), vig].filter(Boolean).join(" · ") + " ");
              if (q.id) {
                const ver = el("a", "", "ver"); ver.href = "/cotizaciones?ver=" + q.id;
                const pdf = el("a", "", "PDF"); pdf.href = "/cotizacion/" + q.id + ".pdf"; pdf.target = "_blank"; pdf.rel = "noopener";
                li.append("(", ver, " · ", pdf, ")");
              }
              ul.append(li);
            }
            cuerpo.append(ul);
            if (u.cotizaciones_total > cot.length) cuerpo.append(el("p", "nota", `Se muestran las ${cot.length} más recientes.`));
          }
          const fac = u.facturas_por_anio || [], totalFac = fac.reduce((a, f) => a + f.n, 0);
          cuerpo.append(el("h4", "", `Facturas y otros comprobantes: ${fmt.format(totalFac)}`));
          if (fac.length) {
            const caja = el("div", "anios");
            for (const f of fac) caja.append(anioComprobantes(l, f));
            cuerpo.append(caja);
          }
          if (u.cotizaciones_total || totalFac)
            cuerpo.append(el("p", "nota", "Mientras haya cotizaciones o comprobantes con esta lista, Tango no deja eliminarla."));
        }
      } catch (e) { cargado = false; cuerpo.replaceChildren(el("p", "mensaje-error", textoError(e))); }
    });
    return s;
  }

  // Comprobantes de un año (se piden al desplegar) y, al tocar uno, sus renglones
  function anioComprobantes(l, f) {
    const d = el("details", "anio"); d.append(el("summary", "", `${f.anio}: ${fmt.format(f.n)}`));
    const cuerpo = el("div"); d.append(cuerpo);
    let cargado = false;
    d.addEventListener("toggle", async () => {
      if (!d.open || cargado) return;
      cargado = true; cuerpo.replaceChildren(el("p", "nota", "Consultando…"));
      try {
        const cs = (await pedir(`/api/listas/${l.id}/comprobantes?anio=${f.anio}`, true)).datos;
        const ul = el("ul", "comprobantes");
        for (const c of cs) {
          const li = el("li");
          const b = el("details"); 
          const importe = c.importe == null ? "" : `${c.moneda} ${fmtPrecio.format(c.importe)}`;
          b.append(el("summary", "", [`${c.tipo} ${c.numero}`, fecha(c.fecha), c.cliente || c.codigo_cliente, importe].filter(Boolean).join(" · ")));
          const det = el("div"); b.append(det);
          let ok = false;
          b.addEventListener("toggle", async () => {
            if (!b.open || ok) return;
            ok = true; det.replaceChildren(el("p", "nota", "Consultando…"));
            try {
              const rs = (await pedir(`/api/comprobantes/renglones?t=${encodeURIComponent(c.t_comp)}&n=${encodeURIComponent(c.n_comp)}`, true)).datos;
              if (!rs.length) { det.replaceChildren(el("p", "nota", "Sin renglones de artículos.")); return; }
              const t = el("table", "renglones-comp"); const tb = el("tbody");
              for (const r of rs) {
                const tr = el("tr");
                tr.append(el("td", "", `${r.descripcion || r.codigo} `), el("td", "der", fmt.format(r.cantidad || 0)),
                          el("td", "der", r.precio == null ? "" : fmtPrecio.format(r.precio)));
                tr.firstChild.append(el("span", "nota", r.codigo)); tb.append(tr);
              }
              t.append(tb); det.replaceChildren(t);
            } catch (e) { ok = false; det.replaceChildren(el("p", "mensaje-error", textoError(e))); }
          });
          li.append(b); ul.append(li);
        }
        cuerpo.replaceChildren(ul);
      } catch (e) { cargado = false; cuerpo.replaceChildren(el("p", "mensaje-error", textoError(e))); }
    });
    return d;
  }

  function dibujarLista() {
    const l = actual.lista;
    const frag = document.createDocumentFragment();
    const d = el("div", "detalle");
    const cab = el("div", "tarjeta cab-lista");
    cab.append(el("div", "nombre", l.nombre));
    const cli = actual.cliente;
    cab.append(el("p", "", `Lista ${l.numero} · ${l.moneda === "$" ? "pesos" : "dólares"} · ${fmt.format(actual.renglones.length)} artículos`));
    cab.append(el("p", "", cli ? `Precios para ${cli.razon_social || cli.codigo} (precio especial del cliente)` : "Precios de lista, iguales para todos los clientes que la usen."));
    const resumen = listas.find(x => x.id === l.id);
    const asignados = resumen ? resumen.clientes_asignados : [];
    cab.append(el("p", "", asignados.length
      ? `La usa${asignados.length > 1 ? "n" : ""} en Tango: ${asignados.length > 3 ? asignados.slice(0, 3).join(", ") + ` y ${asignados.length - 3} más` : asignados.join(", ")}`.replace(/\.?$/, ".")
      : "Ningún cliente la tiene asignada en Tango."));
    const acc = el("div", "acciones");
    // Exportar: un renglon por precio (el de lista y cada precio especial de cliente)
    acc.append(HT.botonExportar(() => HT.exportar(`Lista ${l.numero} ${l.nombre}`,
      [["Código"], ["Descripción"], ["Cliente"], ["Moneda"], ["Precio", "numero"], ["Modificado"]],
      actual.renglones.flatMap(r => [
        ...(r.precio > 0 || !(r.especiales || []).length ? [[r.codigo_articulo, r.descripcion, "Todos", l.moneda, r.precio, HT.fecha(r.modificado)]] : []),
        ...(r.especiales || []).map(e => [r.codigo_articulo, r.descripcion, e.razon_social || e.codigo_cliente, l.moneda, e.precio, HT.fecha(r.modificado)]),
      ]))));
    if (HT.esAdmin() && puedeEditar()) {
      const asig = el("button", "boton chico", "Asignar a un cliente"); asig.type = "button"; asig.addEventListener("click", asignarLista);
      const b = el("button", "boton chico peligro", "Eliminar lista"); b.type = "button"; b.addEventListener("click", eliminarLista);
      acc.append(asig, b);
    }
    cab.append(acc);
    d.append(cab);
    d.append(seccionUsos(l));
    if (puedeEditar()) d.append(formAgregar());

    const ts = tokens(ui.q.value);
    const filas = ts.length ? actual.renglones.filter(r => {
      const txt = norm(r.codigo_articulo + " " + r.descripcion);
      return ts.every(t => txt.includes(t) || sinCeros(norm(r.codigo_articulo)).includes(sinCeros(t)));
    }) : actual.renglones;
    if (!filas.length) {
      d.append(el("p", "aviso", actual.renglones.length ? "Ningún artículo de la lista coincide con la búsqueda." : "La lista todavía no tiene artículos."));
    } else {
      const ul = el("ul", "renglones tarjeta");
      for (const r of filas.slice(0, MAX_FILAS)) ul.append(filaRenglon(r));
      d.append(ul);
      if (filas.length > MAX_FILAS) d.append(el("p", "mas", `Se muestran ${MAX_FILAS} de ${fmt.format(filas.length)}. Escribí para buscar un artículo.`));
    }
    if (!actual.especiales_leidos) d.append(el("p", "pie", "Lista muy grande: se muestran los precios de lista, sin los precios especiales por cliente."));
    frag.append(d);
    ui.resultados.replaceChildren(frag);
  }

  function filaRenglon(r) {
    const li = el("li", "renglon" + (editando === r.id ? " editando" : ""));
    li.append(el("span", "cod", r.codigo_articulo), el("span", "desc", r.descripcion || "(sin descripción)"));
    const m = precioMostrado(r);
    const v = el("span", "valor" + (m.precio > 0 ? "" : " cero"));
    if (m.precio > 0) v.append(el("span", "moneda", actual.lista.moneda), fmtPrecio.format(m.precio));
    else v.textContent = "Sin precio";
    li.append(v);
    const otros = (r.especiales || []).filter(e => e.id_cliente !== m.cliente);
    if (otros.length) li.append(el("span", "meta", "También: " + otros.map(e => `${e.codigo_cliente} ${fmtPrecio.format(e.precio)}`).join(", ")));
    if (puedeEditar()) {
      if (editando === r.id) li.append(editorPrecio(r, m));
      else {
        const b = el("div", "botones");
        const cambiar = el("button", "boton chico", "Cambiar precio"); cambiar.type = "button";
        cambiar.addEventListener("click", () => { editando = r.id; render(); setTimeout(() => { const c = document.querySelector(".editor-precio .campo"); c && c.focus(); }, 30); });
        const quitar = el("button", "boton chico peligro", "Quitar"); quitar.type = "button";
        let hasta = 0;
        quitar.addEventListener("click", async () => {
          if (Date.now() > hasta) { hasta = Date.now() + 4000; quitar.classList.add("confirmar"); quitar.textContent = "¿Quitar de la lista? Tocá de nuevo";
            setTimeout(() => { quitar.classList.remove("confirmar"); quitar.textContent = "Quitar"; }, 4000); return; }
          quitar.disabled = true; quitar.textContent = "Quitando…";
          try {
            await escribir("/api/precios/quitar", { renglon: r.id });
            await abrirLista(actual.lista.id, true);
            ofrecerDeshacerQuitar(r, m);
          }
          catch (e) { alertar(li, e.message); quitar.disabled = false; quitar.textContent = "Quitar"; }
        });
        b.append(cambiar, quitar); li.append(b);
      }
    }
    return li;
  }

  // ---------------------------------------------------------------- deshacer
  // Despues de cambiar o quitar un precio queda unos segundos un aviso con "Deshacer".
  // Deshacer es otro cambio normal (queda en el registro con quien lo hizo).
  function ofrecerDeshacerCambio(r, m, nuevo) {
    const idLista = actual.lista.id;
    HT.avisar(`${r.codigo_articulo}: ${fmtPrecio.format(m.precio)} → ${fmtPrecio.format(nuevo)}`, { texto: "Deshacer", alTocar: async () => {
      try {
        await escribir("/api/precios/cambiar", { renglon: r.id, precio: m.precio, cliente: m.cliente });
        if (actual && actual.lista.id === idLista) await abrirLista(idLista, true);
        HT.avisar(`${r.codigo_articulo} volvió a ${fmtPrecio.format(m.precio)}`);
      } catch (e) { alert("No se pudo deshacer: " + e.message); }
    } });
  }

  // Quitar se deshace volviendo a agregar el articulo con el precio que tenia. Si tenia precios
  // especiales de otros clientes no se ofrece: se perderian, y conviene que lo resuelva una persona.
  function ofrecerDeshacerQuitar(r, m) {
    const otros = (r.especiales || []).filter(e => e.id_cliente !== m.cliente);
    if (otros.length) {
      HT.avisar(`Se quitó ${r.codigo_articulo}. Tenía ${otros.length} precio${otros.length > 1 ? "s" : ""} especial${otros.length > 1 ? "es" : ""} más: si fue un error, cargalos de nuevo.`, null, 8);
      return;
    }
    const idLista = actual.lista.id;
    const cli = m.cliente ? (r.especiales || []).find(e => e.id_cliente === m.cliente) : null;
    HT.avisar(`Se quitó ${r.codigo_articulo} de la lista`, { texto: "Deshacer", alTocar: async () => {
      try {
        await escribir("/api/precios/agregar", { lista: idLista, articulo: r.codigo_articulo, precio: m.precio,
                                                 cliente: m.cliente, codigo_cliente: cli ? cli.codigo_cliente : "" });
        if (actual && actual.lista.id === idLista) await abrirLista(idLista, true);
        HT.avisar(`${r.codigo_articulo} volvió a la lista`);
      } catch (e) { alert("No se pudo deshacer: " + e.message); }
    } });
  }

  function alertar(contenedor, texto) {
    contenedor.querySelectorAll(".mensaje-error").forEach(x => x.remove());
    const p = el("p", "mensaje-error", texto); p.style.gridColumn = "1 / -1";
    contenedor.append(p);
  }

  // "1.234,56" o "1234,56" (coma decimal) o "1234.56" (punto decimal, si no hay coma)
  const leerPrecio = t => {
    const x = String(t).trim();
    const n = Number(x.includes(",") ? x.replace(/\./g, "").replace(",", ".") : x);
    return x && Number.isFinite(n) ? n : NaN;
  };

  function editorPrecio(r, m) {
    const caja = el("div", "editor-precio");
    const campo = el("input", "campo"); campo.inputMode = "decimal"; campo.value = m.precio ? String(m.precio).replace(".", ",") : "";
    campo.setAttribute("aria-label", "Precio nuevo");
    const cambio = el("span", "cambio");
    const guardar = el("button", "boton chico primario", "Guardar"); guardar.type = "button";
    const cancelar = el("button", "boton chico", "Cancelar"); cancelar.type = "button";
    const mostrar = () => {
      const n = leerPrecio(campo.value);
      cambio.replaceChildren();
      if (Number.isNaN(n) || n < 0) { cambio.textContent = "Escribí un precio válido."; guardar.disabled = true; return; }
      guardar.disabled = n === m.precio;
      cambio.append(el("b", "", fmtPrecio.format(m.precio)), " → ", el("b", "", fmtPrecio.format(n)));
    };
    campo.addEventListener("input", mostrar);
    campo.addEventListener("keydown", e => { if (e.key === "Enter" && !guardar.disabled) guardar.click(); if (e.key === "Escape") cancelar.click(); });
    cancelar.addEventListener("click", () => { editando = null; render(); });
    guardar.addEventListener("click", async () => {
      guardar.disabled = true; guardar.textContent = "Guardando…";
      try {
        const nuevo = leerPrecio(campo.value);
        await escribir("/api/precios/cambiar", { renglon: r.id, precio: nuevo, cliente: m.cliente });
        editando = null; await abrirLista(actual.lista.id, true);
        ofrecerDeshacerCambio(r, m, nuevo);
      } catch (e) { alertar(caja, e.message); guardar.disabled = false; guardar.textContent = "Guardar"; }
    });
    caja.append(campo, cambio, guardar, cancelar);
    mostrar();
    return caja;
  }

  function formAgregar() {
    const t = el("div", "tarjeta agregar");
    t.append(el("h3", "", "Agregar artículo"));
    const fila = el("div", "agregar-fila");
    const art = el("input", "campo campo-art"); art.placeholder = "Código o descripción"; art.autocomplete = "off"; art.setAttribute("aria-label", "Artículo");
    const precio = el("input", "campo"); precio.placeholder = "Precio"; precio.inputMode = "decimal"; precio.setAttribute("aria-label", "Precio");
    const boton = el("button", "boton primario", "Agregar"); boton.type = "button"; boton.disabled = true;
    fila.append(art, precio, boton);
    const sug = el("ul", "sugerencias"); sug.hidden = true;
    const elegido = el("div", "elegido"); elegido.hidden = true;
    let codigo = null;
    const yaEsta = new Set(actual.renglones.map(r => r.codigo_articulo));
    const habilitar = () => { const n = leerPrecio(precio.value); boton.disabled = !codigo || Number.isNaN(n) || n < 0 || precio.value.trim() === ""; };
    art.addEventListener("focus", async () => {
      if (articulos) return;
      try { articulos = (await pedir("/api/articulos")).datos.map(a => ({ ...a, _t: norm(a.codigo + " " + a.descripcion) })); }
      catch (e) { alertar(t, textoError(e)); }
    });
    art.addEventListener("input", () => {
      codigo = null; elegido.hidden = true; habilitar();
      const ts = tokens(art.value);
      sug.replaceChildren();
      if (!ts.length || !articulos) { sug.hidden = true; return; }
      const res = articulos.filter(a => ts.every(x => a._t.includes(x))).slice(0, 30);
      for (const a of res) {
        const li = el("li"); const b = el("button"); b.type = "button";
        b.append(el("small", "", a.codigo), a.descripcion + (yaEsta.has(a.codigo) ? " (ya está en la lista)" : ""));
        b.disabled = yaEsta.has(a.codigo);
        b.addEventListener("click", () => {
          codigo = a.codigo; art.value = a.codigo + " " + a.descripcion; sug.hidden = true;
          elegido.hidden = true; habilitar(); precio.focus();
        });
        li.append(b); sug.append(li);
      }
      sug.hidden = !res.length;
    });
    precio.addEventListener("input", habilitar);
    precio.addEventListener("keydown", e => { if (e.key === "Enter" && !boton.disabled) boton.click(); });
    boton.addEventListener("click", async () => {
      boton.disabled = true; boton.textContent = "Agregando…";
      try {
        const cli = actual.cliente;
        await escribir("/api/precios/agregar", { lista: actual.lista.id, articulo: codigo, precio: leerPrecio(precio.value),
                                                 cliente: cli ? cli.id : null, codigo_cliente: cli ? cli.codigo : "" });
        await abrirLista(actual.lista.id, true);
      } catch (e) { alertar(t, e.message); boton.disabled = false; boton.textContent = "Agregar"; }
    });
    t.append(fila, sug, elegido);
    return t;
  }

  // ---------------------------------------------------------------- importar desde Excel
  const ESTADOS_IMP = { agregar: "Agregar", igual: "Ya está", distinto: "Distinto", error: "Error", no_cargar: "No cargar" };

  function importarExcel() {
    const dlg = ventana("Importar listas desde Excel", async (d, cerrar) => {
      d.classList.add("ancha");
      const cuerpo = el("div"); d.append(cuerpo);
      const pie = el("div", "acciones"); d.append(pie);
      const cerrarB = el("button", "boton", "Cerrar"); cerrarB.type = "button"; cerrarB.addEventListener("click", cerrar);

      // Si hay una importacion en curso, mostrar el avance directamente
      try { const e = (await pedir("/api/listas/importar/estado", true)).datos; if (e.corriendo) return seguir(); } catch {}
      elegir();

      function elegir(mensaje) {
        cuerpo.replaceChildren(
          el("p", "", "Elegí el Excel con las listas. Primero vas a ver qué cambiaría en Tango; no se graba nada hasta que confirmes."),
          el("p", "nota", "Tiene que tener una hoja con las columnas Lista, Cliente, Artículo y Precio (y opcionalmente Cargar, Precio corregido y Observaciones), y puede tener una hoja Listas con Nro lista y Descripción."));
        const f = el("input"); f.type = "file"; f.accept = ".xlsx";
        cuerpo.append(f);
        if (mensaje) cuerpo.append(el("p", "mensaje-error", mensaje));
        pie.replaceChildren(cerrarB);
        f.addEventListener("change", async () => {
          const archivo = f.files[0]; if (!archivo) return;
          cuerpo.append(el("p", "nota", "Leyendo el Excel y comparando con Tango…"));
          try {
            const b64 = await new Promise((ok, mal) => { const r = new FileReader();
              r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = mal; r.readAsDataURL(archivo); });
            const plan = (await HT.escribir("/api/listas/importar/analizar", { archivo: b64 })).datos;
            vistaPrevia(plan);
          } catch (e) { elegir(e.message); }
        });
      }

      function vistaPrevia(plan) {
        const r = plan.resumen;
        const caja = (n, txt, mal) => { const x = el("div", mal && n ? "mal" : ""); x.append(el("b", "", fmt.format(n)), el("span", "", txt)); return x; };
        const res = el("div", "imp-resumen");
        res.append(caja(r.listas_nuevas, "listas nuevas"), caja(r.listas_existentes, "listas que ya existen"),
                   caja(r.agregar, "precios para agregar"), caja(r.igual, "ya cargados igual"),
                   caja(r.distinto, "ya cargados con otro precio"), caja(r.asignaciones, "clientes a los que se asigna la lista"),
                   caja(r.error + r.listas_con_error, "errores (no se cargan)", true));
        const ul = el("ul", "imp-listas");
        for (const l of plan.listas) {
          const li = el("li"); const det = el("details"); const sum = el("summary");
          const cuenta = e => l.renglones.filter(x => x.estado === e).length;
          sum.append(el("b", "", `${l.numero} · ${l.nombre}`),
            el("small", "", (l.existe ? "existe" : "nueva") + ` · ${l.razon_social || l.cliente}`),
            el("small", "", [cuenta("agregar") && `${cuenta("agregar")} a agregar`, cuenta("igual") && `${cuenta("igual")} iguales`,
                              cuenta("distinto") && `${cuenta("distinto")} distintos`, cuenta("error") && `${cuenta("error")} con error`]
                              .filter(Boolean).join(" · ")));
          if (l.asignar_de) sum.append(el("small", "", `asigna la lista (hoy usa ${l.asignar_de})`));
          if (l.nota) sum.append(el("small", "", l.nota));
          if (l.error) sum.append(el("span", "err", l.error));
          det.append(sum);
          const rs = el("ul", "imp-renglones");
          for (const x of l.renglones) {
            const fila = el("li", x.estado);
            const desc = el("span"); desc.append(`${x.articulo} ${x.descripcion}`);
            if (x.motivo) desc.append(el("small", "", x.motivo));
            if (x.observacion) desc.append(el("small", "", "Obs.: " + x.observacion));
            const fp = v => v == null ? "—" : fmtPrecio.format(v);
            const precio = x.estado === "distinto" ? `${fp(x.actual)} → ${fp(x.precio)}` : (x.precio ? fp(x.precio) : "—");
            fila.append(el("span", "est", ESTADOS_IMP[x.estado]), desc, el("span", "", precio));
            rs.append(fila);
          }
          det.append(rs); li.append(det); ul.append(li);
        }
        const op1 = el("label", "imp-op"); const c1 = el("input"); c1.type = "checkbox";
        op1.append(c1, el("span", "", `Cambiar también los ${r.distinto} precios que ya están cargados con otro valor`));
        const op2 = el("label", "imp-op"); const c2 = el("input"); c2.type = "checkbox";
        op2.append(c2, el("span", "", `Saltear los ${r.con_observaciones} precios que tienen observaciones (para cargarlos después de revisarlos)`));
        const total = el("p", "nota");
        const aplicar = el("button", "boton primario", "Cargar en Tango"); aplicar.type = "button";
        const cuenta = () => {
          const n = plan.listas.filter(l => !l.error).flatMap(l => l.renglones)
            .filter(x => (x.estado === "agregar" || (c1.checked && x.estado === "distinto")) && !(c2.checked && x.observacion)).length;
          total.textContent = `Se van a grabar ${n} precios en Tango, además de crear las listas nuevas y asignarlas a sus clientes. Lleva unos minutos.`;
          aplicar.disabled = !n;
        };
        c1.addEventListener("change", cuenta); c2.addEventListener("change", cuenta);
        cuenta();
        cuerpo.replaceChildren(res, ul);
        if (r.distinto) cuerpo.append(op1);
        if (r.con_observaciones) cuerpo.append(op2);
        cuerpo.append(total);
        const otro = el("button", "boton", "Elegir otro archivo"); otro.type = "button"; otro.addEventListener("click", () => elegir());
        aplicar.addEventListener("click", async () => {
          if (!confirm("¿Cargar estos precios en Tango? Cada cambio queda en el registro de cambios.")) return;
          aplicar.disabled = true;
          try {
            await HT.escribir("/api/listas/importar/aplicar", { plan: plan.id, actualizar_distintos: c1.checked, saltear_observaciones: c2.checked });
            seguir();
          } catch (e) { alert(e.message); aplicar.disabled = false; }
        });
        pie.replaceChildren(cerrarB, otro, aplicar);
      }

      async function seguir() {
        const barra = el("div", "avance"); const relleno = el("div"); barra.append(relleno);
        const txt = el("p", "nota"); const errs = el("ul", "imp-renglones");
        cuerpo.replaceChildren(el("p", "", "Cargando en Tango. Podés cerrar esta ventana: la carga sigue en el servidor."), barra, txt, errs);
        pie.replaceChildren(cerrarB);
        while (document.body.contains(d)) {
          let e;
          try { e = (await pedir("/api/listas/importar/estado", true)).datos; } catch { await new Promise(r => setTimeout(r, 2000)); continue; }
          relleno.style.width = (e.total ? Math.round(100 * e.hechos / e.total) : 0) + "%";
          txt.textContent = e.corriendo ? `${e.hechos} de ${e.total} · ${e.actual}`
            : `Terminado: ${e.hechos - e.errores.length} de ${e.total} pasos sin errores.`;
          errs.replaceChildren(...e.errores.map(x => { const li = el("li", "error");
            li.append(el("span", "est", "Error"), el("span", "", `${x.lista} ${x.articulo}`), el("span", "", x.error)); return li; }));
          if (!e.corriendo) { cargarListas(true).then(() => render()); break; }
          await new Promise(r => setTimeout(r, 1500));
        }
      }
    });
    return dlg;
  }

  function nuevaLista() {
    ventana("Nueva lista de precios", (d, cerrar) => {
      const f = el("form");
      const n = el("input", "campo"); n.id = "nl-nombre"; n.maxLength = 20; n.required = true;
      const ln = el("label", "etiqueta", "Nombre (hasta 20 letras; por ejemplo el del cliente)"); ln.htmlFor = "nl-nombre";
      const lm = el("span", "etiqueta", "Moneda");
      const radios = el("div", "radios");
      for (const [v, t, ch] of [["US$", "Dólares", true], ["$", "Pesos", false]]) {
        const lab = el("label"); const r = el("input"); r.type = "radio"; r.name = "moneda"; r.value = v; r.checked = ch;
        lab.append(r, t); radios.append(lab);
      }
      const sig = Math.max(0, ...listas.map(l => l.numero || 0)) + 1;
      const nro = el("input", "campo"); nro.id = "nl-numero"; nro.inputMode = "numeric"; nro.placeholder = String(sig);
      const lnro = el("label", "etiqueta", "Número de lista (si lo dejás vacío, " + sig + ")"); lnro.htmlFor = "nl-numero";
      const lc = el("label", "etiqueta", "Cliente que la va a usar (opcional)"); lc.htmlFor = "sc-cliente";
      const sel = selectorCliente();
      const nota = el("p", "", "Si elegís un cliente, la lista queda asignada en su ficha de Tango. Si no, la podés asignar después.");
      const err = el("p", "mensaje-error"); err.hidden = true;
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cancelar"); c.type = "button"; c.addEventListener("click", cerrar);
      const ok = el("button", "boton primario", "Crear lista"); ok.type = "submit";
      acc.append(c, ok);
      f.append(ln, n, lm, radios, lnro, nro, lc, sel.nodo, nota, err, acc);
      f.addEventListener("submit", async e => {
        e.preventDefault(); ok.disabled = true; err.hidden = true;
        try {
          const elegido = sel.valor();
          const res = await escribir("/api/listas/crear", { nombre: n.value, moneda: f.moneda.value,
                                                            numero: nro.value.trim() ? Number(nro.value) : null,
                                                            cliente: elegido ? elegido.id : null });
          if (res.datos.error_asignacion) alert("La lista se creó, pero no se pudo asignar al cliente: " + res.datos.error_asignacion);
          if (elegido) clientes = null;
          cerrar();
          await cargarListas(true);
          location.hash = "lista=" + res.datos.id;
        } catch (ex) { err.textContent = ex.message; err.hidden = false; ok.disabled = false; }
      });
      d.append(f);
      setTimeout(() => n.focus(), 50);
    });
  }

  // Buscador de clientes con su lista actual. valor() = cliente elegido o null
  function selectorCliente(alCambiar) {
    const nodo = el("div", "selector-cliente");
    const q = el("input", "campo"); q.id = "sc-cliente"; q.autocomplete = "off"; q.placeholder = "Código o razón social";
    const sug = el("ul", "sugerencias"); sug.hidden = true;
    let elegido = null;
    const cambiar = c => { elegido = c; alCambiar && alCambiar(c); };
    let cargando = null;
    const cargar = () => cargando || (cargando = pedir("/api/clientes", true).then(d => {
      clientes = d.datos.filter(c => c.habilitado).map(c => ({ ...c, _t: norm(c.codigo + " " + c.razon_social + " " + c.cuit) }));
      mostrar();
    }).catch(e => { cargando = null; alertar(nodo, textoError(e)); }));
    q.addEventListener("focus", () => { if (!clientes) cargar(); });
    q.addEventListener("input", () => { cambiar(null); if (!clientes) cargar(); mostrar(); });
    function mostrar() {
      if (elegido) return;
      const ts = tokens(q.value);
      sug.replaceChildren();
      if (!ts.length) { sug.hidden = true; return; }
      if (!clientes) { sug.append(el("li", "vacio", "Cargando clientes…")); sug.hidden = false; return; }
      const res = clientes.filter(c => ts.every(x => c._t.includes(x))).slice(0, 30);
      for (const c of res) {
        const li = el("li"); const b = el("button"); b.type = "button";
        b.append(el("small", "", c.codigo + (c.lista_precios ? " · hoy usa " + c.lista_precios : " · sin lista")), c.razon_social);
        b.addEventListener("click", () => { q.value = c.razon_social; sug.hidden = true; cambiar(c); });
        li.append(b); sug.append(li);
      }
      if (!res.length) sug.append(el("li", "vacio", "Ningún cliente coincide."));
      sug.hidden = false;
    }
    nodo.append(q, sug);
    return { nodo, valor: () => elegido, foco: () => q.focus() };
  }

  function asignarLista() {
    const l = actual.lista;
    ventana("Asignar la lista " + l.nombre, (d, cerrar) => {
      const f = el("form");
      const lc = el("label", "etiqueta", "Cliente"); lc.htmlFor = "sc-cliente";
      const info = el("p", "", "Se cambia el campo Lista de precios en la ficha del cliente en Tango. Desde ese momento, sus cotizaciones y pedidos nuevos toman esta lista.");
      const err = el("p", "mensaje-error"); err.hidden = true;
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cancelar"); c.type = "button"; c.addEventListener("click", cerrar);
      const ok = el("button", "boton primario", "Asignar"); ok.type = "submit"; ok.disabled = true;
      const sel = selectorCliente(cli => {
        err.hidden = true;
        ok.disabled = !cli || norm(cli.lista_precios || "") === norm(l.nombre);
        info.textContent = !cli ? "Se cambia el campo Lista de precios en la ficha del cliente en Tango."
          : norm(cli.lista_precios || "") === norm(l.nombre) ? `${cli.razon_social} ya usa esta lista.`
          : `${cli.razon_social} deja de usar ${cli.lista_precios || "la lista que tiene"} y pasa a usar ${l.nombre}. Sus cotizaciones y pedidos nuevos toman esta lista.`;
        const dueno = actual.cliente;
        aviso.hidden = !(cli && dueno && dueno.id !== cli.id);
        if (!aviso.hidden) aviso.textContent = `Ojo: en esta lista los precios están cargados como especiales de ${dueno.razon_social || dueno.codigo} y el precio de lista está en 0. ${cli.razon_social} vería los artículos a 0 hasta que le cargues sus precios.`;
      });
      const aviso = el("p", "mensaje-error"); aviso.hidden = true;
      acc.append(c, ok);
      f.append(lc, sel.nodo, info, aviso, err, acc);
      f.addEventListener("submit", async e => {
        e.preventDefault(); const cli = sel.valor(); if (!cli) return;
        ok.disabled = true; ok.textContent = "Asignando…"; err.hidden = true;
        try {
          await escribir("/api/listas/asignar", { lista: l.id, cliente: cli.id });
          clientes = null; cerrar();
          await cargarListas(true); render();
        } catch (ex) { err.textContent = ex.message; err.hidden = false; ok.disabled = false; ok.textContent = "Asignar"; }
      });
      d.append(f);
      setTimeout(sel.foco, 50);
    });
  }

  function eliminarLista() {
    const l = actual.lista;
    ventana("Eliminar la lista " + l.nombre, (d, cerrar) => {
      d.append(el("p", "", `Se quitan sus ${actual.renglones.length} artículos y se borra la lista de Tango. Lo que tenía queda guardado en el registro de cambios.`));
      const f = el("form");
      const n = el("input", "campo"); n.id = "el-nombre"; n.autocomplete = "off";
      const ln = el("label", "etiqueta", `Para confirmar, escribí ${l.nombre}`); ln.htmlFor = "el-nombre";
      const err = el("p", "mensaje-error"); err.hidden = true;
      const acc = el("div", "acciones");
      const c = el("button", "boton", "Cancelar"); c.type = "button"; c.addEventListener("click", cerrar);
      const ok = el("button", "boton peligro confirmar", "Eliminar lista"); ok.type = "submit"; ok.disabled = true;

      // Si hay clientes que la usan, se elige aca mismo la lista que pasan a usar
      const resumen = listas.find(x => x.id === l.id);
      const usan = resumen ? resumen.clientes_asignados : [];
      let otra = null;
      if (usan.length) {
        const caja = el("div", "reasignar");
        caja.append(el("p", "", (usan.length === 1 ? `La usa ${usan[0]}` : `La usan ${usan.length} clientes: ${usan.slice(0, 4).join(", ")}${usan.length > 4 ? "…" : ""}`).replace(/\.?$/, ". ") +
          "Para que no queden sin lista, elegí cuál pasan a usar. Se cambia en su ficha de Tango antes de eliminar."));
        const lo = el("label", "etiqueta", usan.length === 1 ? "Lista nueva del cliente" : "Lista nueva de esos clientes"); lo.htmlFor = "el-otra";
        otra = el("select", "campo"); otra.id = "el-otra";
        otra.append(new Option("Elegí una lista", ""));
        const general = listas.filter(x => x.id !== l.id).sort((x, y) => x.numero - y.numero);
        for (const x of general) otra.append(new Option(`${x.numero} · ${x.nombre} (${x.moneda === "US$" ? "dólares" : "pesos"})`, x.id));
        const metco = general.find(x => norm(x.nombre) === "metco");
        if (metco) otra.value = metco.id;
        const aviso = el("p", "nota", "Ojo: los precios especiales que tenían en esta lista no pasan a la otra. Si eran precios propios del cliente, conviene editarlos en vez de borrar la lista.");
        caja.append(lo, otra, aviso);
        d.append(caja);
      }
      const habilitar = () => { ok.disabled = norm(n.value) !== norm(l.nombre) || (otra && !otra.value); };
      n.addEventListener("input", habilitar);
      if (otra) otra.addEventListener("change", habilitar);
      ok.textContent = usan.length ? "Cambiar y eliminar" : "Eliminar lista";
      const textoOk = ok.textContent;
      acc.append(c, ok);
      f.append(ln, n, err, acc);
      f.addEventListener("submit", async e => {
        e.preventDefault(); ok.disabled = true; ok.textContent = usan.length ? "Cambiando y eliminando…" : "Eliminando…"; err.hidden = true;
        try {
          await escribir("/api/listas/eliminar", { lista: l.id, confirmar: n.value, reasignar_a: otra ? Number(otra.value) : null });
          cerrar(); actual = null; location.hash = ""; await cargarListas(true);
        } catch (ex) { err.textContent = ex.message; err.hidden = false; ok.disabled = false; ok.textContent = textoOk;
                       cargarListas(true); }
      });
      d.append(f);
      setTimeout(() => n.focus(), 50);
    });
  }

  // ---------------------------------------------------------------- eventos
  HT.conectarBuscador(ui.q, ui.limpiar, render);
  $("actualizar").addEventListener("click", () => { const id = idDelHash(); id ? abrirLista(id, true) : cargarListas(true); });
  ui.volver.addEventListener("click", e => { e.preventDefault(); location.hash = ""; });
  window.addEventListener("hashchange", () => {
    ui.q.value = ""; editando = null; window.scrollTo(0, 0);
    const id = idDelHash();
    if (id) abrirLista(id); else render();
  });

  const inicial = new URLSearchParams(location.search).get("q");
  if (inicial) { ui.q.value = inicial; ui.limpiar.hidden = false; }
  dibujarEdicion();
  cargarListas(false);
  if (idDelHash()) abrirLista(idDelHash());
})();
</script>
</body>
</html>
