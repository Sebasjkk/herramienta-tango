<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Cotizaciones | Herramienta Tango</title>
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/comun.css">
<script>try{var t=localStorage.getItem("ht_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
<style>
  .explica { margin: 8px 0 0; font-size: .86rem; max-width: 70ch; }
  .pestanas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pestana { font: inherit; font-size: .88rem; font-weight: 600; min-height: 36px; padding: 4px 14px; border-radius: 999px;
    border: 1px solid var(--linea); background: var(--papel); color: var(--plomo); cursor: pointer; }
  .pestana b { font-variant-numeric: tabular-nums; margin-left: 4px; color: var(--grafito); }
  .pestana[aria-selected="true"] { background: var(--patina); border-color: var(--patina); color: var(--sobre-color); }
  .pestana[aria-selected="true"] b { color: var(--sobre-color); }
  @media (max-width: 599px) {   /* celular: una sola fila que se desliza */
    .pestanas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .pestanas::-webkit-scrollbar { display: none; }
    .pestana { flex: none; }
  }

  .lista-cot { list-style: none; margin: 0; padding: 0; }
  .cot { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; text-align: left; font: inherit; color: inherit;
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 11px 14px; margin-bottom: 8px; cursor: pointer; }
  .cot:hover { border-color: var(--patina); }
  .cot[aria-pressed="true"] { border-color: var(--patina); box-shadow: inset 3px 0 0 var(--patina); background: var(--seleccion); }
  .cot .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cot .cli { overflow-wrap: anywhere; }
  .cot .der { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: .82rem; color: var(--plomo); line-height: 1.3; }
  .cot .meta { grid-column: 1 / -1; font-size: .8rem; color: var(--plomo); }
  .etiqueta-estado { display: inline-block; font-size: .74rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--zinc); color: var(--plomo); }
  .e-autorizada { background: var(--patina-suave); color: var(--patina); }
  .e-procesada { background: var(--azul-suave); color: var(--azul); }
  .e-vencida { background: var(--ambar-suave); color: var(--ambar); }
  .e-anulada { background: var(--oxido-suave); color: var(--oxido); }

  .ficha { padding: 18px; }
  .ficha h2 { font-size: 1.35rem; margin: 2px 0 2px; letter-spacing: -0.01em; }
  .ficha .cli { font-weight: 600; }
  .datos-cot { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin: 14px 0 4px; font-size: .88rem; }
  .datos-cot span { display: block; color: var(--plomo); font-size: .78rem; }
  .acciones-cot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .seccion { border-top: 1px solid var(--linea); margin: 16px -18px 0; padding: 14px 18px 4px; }
  .seccion h3 { font-size: .95rem; margin: 0 0 8px; }
  .tabla-envoltura { overflow-x: auto; margin: 0 -18px; padding: 0 6px; }
  .total-cot { text-align: right; font-weight: 700; padding: 8px 12px 0; font-variant-numeric: tabular-nums; }
  .nota { font-size: .88rem; color: var(--plomo); }
  .volver { display: none; }

  @media (min-width: 960px) {
    .contenido-cot { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 20px; align-items: start; }
    .detalle { position: sticky; top: 130px; max-height: calc(100vh - 146px); overflow-y: auto; }
  }
  @media (max-width: 959px) {
    .contenido-cot.viendo .col-lista { display: none; }
    .contenido-cot:not(.viendo) .detalle { display: none; }
    .volver { display: inline-flex; margin-bottom: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1>Cotizaciones</h1>
          <div class="datos"><span id="estado">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar cotización</label>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Número, cliente o vendedor" enterkeyhint="search">
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
        <div class="pestanas" id="pestanas" role="tablist"></div>
        <p class="nota explica" id="explica"></p>
      </div>
      <div class="contenido-cot" id="contenido">
        <div class="col-lista" id="col-lista" aria-live="polite"></div>
        <section class="detalle" id="detalle" aria-live="polite"></section>
      </div>
      <p class="pie">Solo lectura. Las cotizaciones se cargan, anulan y modifican en Tango. «Vencida» es una cotización autorizada cuya vigencia ya pasó.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script>
(() => {
  "use strict";
  HT.iniciar("cotizaciones");
  const { $, el, norm, tokens, fmt, fmtPrecio, fecha, pedir, textoError, cajaError } = HT;
  const hoy = new Date().toISOString().slice(0, 10);

  // Grupos que se muestran: los estados de Tango, mas "Vencida" (autorizada con vigencia pasada)
  const GRUPOS = [
    { id: "autorizada", titulo: "En curso", f: c => c.estado === 2 && !(c.vigencia && c.vigencia < hoy),
      ayuda: "En curso: cotizaciones emitidas, todavía vigentes, que no se pasaron a pedido. Son las que hay que seguir con el cliente." },
    { id: "vencida", titulo: "Vencidas", f: c => c.estado === 2 && c.vigencia && c.vigencia < hoy,
      ayuda: "Vencidas: se emitieron, pero ya pasó su fecha de vigencia sin que se convirtieran en pedido. Para venderle al cliente conviene hacerle una nueva." },
    { id: "procesada", titulo: "Procesadas", f: c => c.estado === 4,
      ayuda: "Procesadas: el cliente aceptó y la cotización ya se pasó a pedido en Tango. Desde ahí sigue el circuito de pedido, remito y factura." },
    { id: "anulada", titulo: "Anuladas", f: c => c.estado === 5,
      ayuda: "Anuladas: se dieron de baja en Tango (por error, por un cambio o porque el cliente no siguió). Quedan solo como registro." },
    { id: "todas", titulo: "Todas", f: () => true },
  ];
  const claseEstado = c => c.estado === 2 ? (c.vigencia && c.vigencia < hoy ? "vencida" : "autorizada")
                       : c.estado === 4 ? "procesada" : c.estado === 5 ? "anulada" : "";
  const textoEstado = c => claseEstado(c) === "vencida" ? "Vencida" : c.estado_texto;

  let cots = [];
  let grupo = "autorizada";
  let elegida = null;
  const renglones = new Map();   // numero -> lista | "cargando" | Error

  async function cargar(forzar) {
    $("contenido").classList.add("cargando");
    $("estado").textContent = "Consultando Tango…";
    let previo = null;
    const usar = d => {
      cots = d.datos.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || b.numero.localeCompare(a.numero));
      $("estado").textContent = HT.textoDatos(d);
      render();
    };
    try {
      const d = await pedir("/api/cotizaciones", forzar, { previo: g => { previo = g; usar(g); } });
      if (forzar) renglones.clear();
      usar(d);
    } catch (e) {
      if (previo) { $("estado").textContent = HT.textoDatos(previo).replace("actualizando…", "sin conexión con Tango"); return; }
      $("estado").textContent = "Sin datos";
      $("col-lista").replaceChildren(cajaError(e, () => cargar(true)));
    } finally { $("contenido").classList.remove("cargando"); }
  }

  function filtradas() {
    const g = GRUPOS.find(x => x.id === grupo);
    const ts = tokens($("q").value);
    return cots.filter(c => g.f(c) && ts.every(t => norm([c.numero_corto, c.numero, c.cliente, c.codigo_cliente, c.vendedor].join(" ")).includes(t)));
  }

  let verPendiente = null;
  function render() {
    if (verPendiente && cots.length) {          // abrir la cotizacion pedida en la pestana que la contenga
      const c = cots.find(x => x.id === verPendiente);
      if (c && !GRUPOS.find(g => g.id === grupo).f(c)) { const g = GRUPOS.find(g => g.f(c)); if (g) grupo = g.id; }
      if (c) elegida = c.id;
      verPendiente = null;
    }
    // Pestanas con cantidades
    const ts = tokens($("q").value);
    const p = $("pestanas"); p.replaceChildren();
    for (const g of GRUPOS) {
      const n = cots.filter(c => g.f(c) && ts.every(t => norm([c.numero_corto, c.numero, c.cliente, c.codigo_cliente, c.vendedor].join(" ")).includes(t))).length;
      const b = el("button", "pestana", g.titulo); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(g.id === grupo));
      b.append(el("b", "", n));
      b.addEventListener("click", () => { grupo = g.id; elegida = null; render(); });
      p.append(b);
    }
    const g = GRUPOS.find(x => x.id === grupo);
    $("explica").textContent = (g && g.ayuda) || "Todas: las cotizaciones de cualquier estado.";
    const lista = filtradas();
    const col = $("col-lista");
    if (!lista.length) {
      col.replaceChildren(cots.length ? el("p", "aviso", "No hay cotizaciones en este grupo.") : HT.esqueleto(6));
      $("detalle").replaceChildren();
      return;
    }
    if (!elegida || !lista.some(c => c.id === elegida)) elegida = window.matchMedia("(min-width: 960px)").matches ? lista[0].id : null;
    const ul = el("ul", "lista-cot");
    for (const c of lista) {
      const li = el("li");
      const b = el("button", "cot"); b.type = "button"; b.setAttribute("aria-pressed", String(c.id === elegida));
      const der = el("span", "der");
      der.append(el("span", "etiqueta-estado e-" + claseEstado(c), textoEstado(c)), el("br"), fecha(c.fecha));
      b.append(el("span", "num", c.numero_corto), el("span", "cli", c.cliente), der,
               el("span", "meta", `${c.vendedor || "Sin vendedor"} · vigencia ${fecha(c.vigencia)} · ${c.moneda === "$" ? "pesos" : "dólares"}`));
      b.addEventListener("click", () => {
        elegida = c.id;
        if (!window.matchMedia("(min-width: 960px)").matches) {
          history.pushState({}, "", "#cot=" + c.id);
          $("contenido").classList.add("viendo"); window.scrollTo(0, 0);
        }
        render();
      });
      li.append(b); ul.append(li);
    }
    col.replaceChildren(ul);
    dibujarFicha();
  }

  function cargarRenglones(c) {
    if (renglones.has(c.numero)) return;
    renglones.set(c.numero, "cargando");
    pedir("/api/cotizaciones/" + encodeURIComponent(c.numero.trim()) + "/renglones")
      .then(d => renglones.set(c.numero, d.datos), e => renglones.set(c.numero, new Error(textoError(e))))
      .then(() => { if (elegida === c.id) dibujarFicha(); });
  }

  function dibujarFicha() {
    const c = cots.find(x => x.id === elegida);
    const cont = $("detalle");
    if (!c) { cont.replaceChildren(); return; }
    const t = el("article", "tarjeta ficha");
    const volver = el("button", "boton volver", "‹ Cotizaciones"); volver.type = "button";
    volver.addEventListener("click", () => history.back());
    t.append(volver);
    t.append(el("span", "etiqueta-estado e-" + claseEstado(c), textoEstado(c)));
    t.append(el("h2", "", "Cotización " + c.numero_corto));
    t.append(HT.linkCliente(c.codigo_cliente, c.cliente));
    const datos = el("div", "datos-cot");
    const d = (et, v) => { const x = el("div"); x.append(el("span", "", et), v || "—"); datos.append(x); };
    d("Fecha", fecha(c.fecha)); d("Vigencia", fecha(c.vigencia)); d("Vendedor", c.vendedor);
    d("Moneda", c.moneda === "$" ? "Pesos" : "Dólares"); d("Cliente", c.codigo_cliente); d("Número en Tango", c.numero);
    t.append(datos);
    const acc = el("div", "acciones-cot");
    const pdf = el("a", "boton primario", "Ver / reimprimir PDF");
    pdf.href = "/cotizacion/" + c.id + ".pdf"; pdf.target = "_blank"; pdf.rel = "noopener";
    acc.append(pdf);
    t.append(acc);

    const s = el("section", "seccion");
    s.append(el("h3", "", "Renglones"));
    cargarRenglones(c);
    const rs = renglones.get(c.numero);
    if (rs === "cargando") s.append(HT.esqueleto(3, "plano"));
    else if (rs instanceof Error) s.append(el("p", "nota", rs.message));
    else if (!rs.length) s.append(el("p", "nota", "No se encontraron renglones."));
    else {
      const conPend = rs.some(r => r.pendiente !== null);
      const tabla = el("table", "tabla");
      const th = el("tr");
      for (const [x, cl] of [["Artículo", ""], ["Cant.", "der"], ["Precio", "der"], ["Desc.", "der"], ...(conPend ? [["Pendiente", "der"]] : [])]) th.append(el("th", cl, x));
      const thead = el("thead"); thead.append(th);
      const tb = el("tbody");
      let total = 0;
      for (const r of rs) {
        const tr = el("tr");
        const art = el("td"); art.append(el("div", "", r.descripcion || r.codigo_articulo)); art.lastChild.style.fontWeight = "600";
        // El codigo lleva a la ficha del articulo (stock, partidas, precios)
        const cod = el("a", "nota", r.codigo_articulo); cod.href = "/buscar?art=" + encodeURIComponent(r.codigo_articulo.trim());
        cod.style.display = "block"; cod.style.color = "var(--patina)";
        art.append(cod);
        const sub = r.cantidad * r.precio * (1 - (r.descuento || 0) / 100);
        total += sub;
        tr.append(art, el("td", "der", fmt.format(r.cantidad)), el("td", "der", fmtPrecio.format(r.precio)),
                  el("td", "der", r.descuento ? fmt.format(r.descuento) + "%" : ""));
        if (conPend) tr.append(el("td", "der", r.pendiente === null ? "" : fmt.format(r.pendiente)));
        tb.append(tr);
      }
      tabla.append(thead, tb);
      const env = el("div", "tabla-envoltura"); env.append(tabla);
      s.append(env, el("div", "total-cot", `Total sin impuestos: ${c.moneda} ${fmtPrecio.format(total)}`));
    }
    t.append(s);
    cont.replaceChildren(t);
  }

  HT.conectarBuscador($("q"), $("limpiar"), () => { elegida = null; render(); });
  $("actualizar").addEventListener("click", () => cargar(true));
  window.addEventListener("popstate", () => { if (!location.hash.startsWith("#cot=")) $("contenido").classList.remove("viendo"); });
  // /cotizaciones?ver=<id>: abrir esa cotizacion (enlace desde Precios > Donde se usa)
  const verId = Number(new URLSearchParams(location.search).get("ver")) || null;
  if (verId) { verPendiente = verId; if (!window.matchMedia("(min-width: 960px)").matches) $("contenido").classList.add("viendo"); }
  if (location.hash.startsWith("#cot=")) history.replaceState(null, "", location.pathname);
  render();
  cargar(false);
})();
</script>
</body>
</html>
