<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Herramienta Tango</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --zinc: #E6EAED;
    --papel: #FFFFFF;
    --grafito: #1B242C;
    --plomo: #5E6B76;
    --linea: #CBD3D9;
    --patina: #0B6E69;
    --patina-suave: #DCEFED;
    --oxido: #B3261E;
    --oxido-suave: #FBE9E7;
    --radio: 12px;
    --fuente: "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--zinc); color: var(--grafito); font: 16px/1.45 var(--fuente); }
  .contenedor { max-width: 720px; margin: 0 auto; padding: 22px 16px 48px; }

  header { margin-bottom: 18px; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  h1 span { color: var(--patina); }
  .estado { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .9rem; color: var(--plomo); }
  .estado::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--linea); }
  .estado.ok::before { background: #1E8E5A; }
  .estado.mal { color: var(--oxido); }
  .estado.mal::before { background: var(--oxido); }

  .modulos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .modulo a {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px;
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 18px 18px; color: inherit; text-decoration: none; min-height: 76px;
  }
  .modulo a:hover { border-color: var(--patina); }
  .modulo a:active { background: var(--patina-suave); }
  .modulo a:focus-visible { outline: 3px solid var(--patina); outline-offset: 2px; }
  .modulo .titulo { font-size: 1.15rem; font-weight: 650; }
  .modulo .desc { grid-column: 1; color: var(--plomo); font-size: .92rem; }
  .modulo .ir { grid-column: 2; grid-row: 1 / span 2; width: 12px; height: 12px;
    border-right: 2.5px solid var(--patina); border-top: 2.5px solid var(--patina); transform: rotate(45deg); margin-right: 4px; }

  .aviso { background: var(--oxido-suave); color: var(--oxido); border: 1px solid #F1C4BF; border-radius: var(--radio); padding: 12px 14px; margin-bottom: 14px; }
  .actualizando { background: var(--patina-suave); color: var(--patina); border: 1px solid #B9DDD9; border-radius: var(--radio); padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  [hidden] { display: none !important; }
  .pie { margin-top: 26px; font-size: .8rem; color: var(--plomo); }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Herramienta <span>Tango</span></h1>
    <div class="estado" id="estado">Conectando…</div>
  </header>

  <div class="aviso" id="aviso" role="alert" hidden></div>
  <div class="actualizando" id="actualizando" role="status" hidden></div>

  <nav aria-label="Módulos">
    <ul class="modulos" id="modulos"></ul>
  </nav>

  <p class="pie">Solo lectura: los datos salen de Tango y no se modifica nada. <span id="version"></span></p>
</div>

<script>
(() => {
  "use strict";
  // Módulos disponibles. Para agregar uno nuevo, se suma acá su página.
  const MODULOS = [
    { titulo: "Stock por partida", desc: "Cuánto hay de cada artículo, en qué lote y despacho.", href: "/stock" },
  ];

  const $ = id => document.getElementById(id);
  const lista = $("modulos");
  for (const m of MODULOS) {
    const li = document.createElement("li"); li.className = "modulo";
    const a = document.createElement("a"); a.href = m.href;
    const t = document.createElement("span"); t.className = "titulo"; t.textContent = m.titulo;
    const d = document.createElement("span"); d.className = "desc"; d.textContent = m.desc;
    const ir = document.createElement("span"); ir.className = "ir"; ir.setAttribute("aria-hidden", "true");
    a.append(t, ir, d); li.append(a); lista.append(li);
  }

  const ESTADOS = {
    ok: ["ok", "Conectado a Tango"],
    sin_conexion: ["mal", "Sin conexión con Tango"],
    token_invalido: ["mal", "Tango rechazó el token"],
    sin_configurar: ["mal", "Falta configurar el programa en la PC"],
  };

  let versionInicial = null;
  async function revisar() {
    try {
      const r = await fetch("/api/estado", { cache: "no-store" });
      const e = await r.json();
      if (versionInicial && e.version !== versionInicial) { location.reload(); return; }
      versionInicial = versionInicial || e.version;
      $("version").textContent = "Versión " + e.version + ".";
      $("aviso").hidden = true;

      const clave = !e.configurado ? "sin_configurar" : e.tango;
      const [clase, texto] = ESTADOS[clave] || ["", "Conectando…"];
      $("estado").className = "estado " + clase;
      $("estado").textContent = texto;

      const a = e.actualizacion || {};
      const instalando = a.estado === "instalando" || a.estado === "reiniciando";
      $("actualizando").hidden = !instalando;
      if (instalando) $("actualizando").textContent = `Instalando la versión ${a.version_disponible}. La página vuelve sola en unos segundos.`;
    } catch {
      $("aviso").textContent = "No hay conexión con el programa de la PC. Revisá que el celular esté en el Wi-Fi de la oficina.";
      $("aviso").hidden = false;
    }
  }
  revisar();
  setInterval(revisar, 15000);
})();
</script>
</body>
</html>
