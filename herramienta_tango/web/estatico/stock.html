<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E69">
<title>Stock por partida | Herramienta Tango</title>
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/comun.css">
<script>try{var t=localStorage.getItem("ht_tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
<style>
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .chip-neg[aria-pressed="true"] { background: var(--oxido); border-color: var(--oxido); color: var(--sobre-color); }
  .chip-neg .cant { font-weight: 650; }

  /* Articulo */
  .articulo {
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    margin-top: 12px; overflow: hidden;
  }
  .art-cab { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 14px 14px 10px; align-items: end; }
  .art-cod { font-size: .82rem; color: var(--plomo); }
  .art-desc { font-weight: 650; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere; }
  .art-total { grid-row: 1 / span 2; grid-column: 2; text-align: right; line-height: 1; }
  .art-total .num { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  .art-total .um { font-size: .95rem; color: var(--plomo); margin-left: 3px; }
  .art-total.neg .num { color: var(--oxido); }
  .art-nota { grid-column: 1 / -1; font-size: .82rem; color: var(--plomo); }
  .art-nota.alerta { color: var(--oxido); }

  /* Lotes: la barra muestra cuanto del stock del articulo esta en cada lote */
  .lotes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea); }
  .lote { position: relative; padding: 10px 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .comp-cab { padding: 16px 18px; margin-bottom: 12px; }
  .comp-cab h2 { font-size: 1.15rem; margin: 0 0 4px; overflow-wrap: anywhere; }
  .comp-cab .nota { font-size: .85rem; color: var(--plomo); margin: 6px 0; }
  .comp-cifras { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .comp-cifra { border: 1px solid var(--linea); border-radius: var(--radio); padding: 8px 14px; min-width: 120px; }
  .comp-cifra b { display: block; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .comp-cifra span { font-size: .8rem; color: var(--plomo); }
  .comp-cifra.c-ok b { color: var(--verde); }
  .comp-cifra.c-mal b { color: var(--oxido); }
  .comp-cifra.c-aviso b { color: var(--ambar); }
  .comp-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .comp-filtros { margin: 0 0 10px; }
  .comp-tabla { overflow: hidden; }
  .comp-tabla td a { color: inherit; }
  .comp-tabla .neg-dif { color: var(--oxido); font-weight: 700; }
  .comp-tabla .pos-dif { color: var(--ambar); font-weight: 700; }
  .comp-notas { font-size: .8rem; color: var(--plomo); max-width: 340px; }
  .lote + .lote { border-top: 1px solid var(--linea-suave); }
  .lote-num { font-weight: 600; overflow-wrap: anywhere; }
  .lote-saldo { text-align: right; font-weight: 600; white-space: nowrap; }
  .lote-meta { grid-column: 1 / -1; font-size: .8rem; color: var(--plomo); display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .lote-meta .vencida { color: var(--oxido); }
  .nivel { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--linea-suave); margin-top: 6px; overflow: hidden; }
  .nivel span { display: block; height: 100%; background: var(--patina); border-radius: 3px; }
  .lote.vacio { color: var(--plomo); }
  .lote.vacio .nivel { display: none; }
  .lote.neg { background: var(--oxido-suave); }
  .lote.neg .lote-saldo, .lote.neg .lote-num { color: var(--oxido); }
  .lote.neg .nivel { display: none; }
  .lote-dep { font-size: .8rem; color: var(--grafito); font-weight: 600; }

  .art-total, .lote-saldo { font-variant-numeric: tabular-nums; }
  .grilla-art { display: grid; gap: 12px; align-items: start; }
  .grilla-art .articulo { margin-top: 0; }
  @media (min-width: 1100px) { .grilla-art { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 560px) { .art-total .num { font-size: 2.3rem; } }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" id="app-nav"></nav>
  <div class="app-principal">
    <div class="pagina">
      <header class="cabecera">
        <div class="cabecera-sup">
          <h1>Stock por partida</h1>
          <div class="datos"><span id="estado">Consultando Tango…</span><button type="button" class="boton-texto" id="actualizar">Actualizar</button></div>
        </div>
      </header>
      <div class="barra">
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="q" style="position:absolute;left:-9999px">Buscar artículo</label>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="Código, descripción, lote o despacho" enterkeyhint="search">
          <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
        </div>
        <div class="filtros">
          <select id="deposito" aria-label="Depósito">
            <option value="CENTRAL">Central</option>
            <option value="">Todos los depósitos</option>
          </select>
          <label class="chip"><input type="checkbox" id="vacios"> Mostrar lotes vacíos</label>
          <button type="button" class="chip chip-neg" id="negativos" aria-pressed="false">Ver negativos <span class="cant" id="cantNeg"></span></button>
          <button type="button" class="chip" id="exportar">Exportar a Excel</button>
          <button type="button" class="chip" id="comparar">Comparar con inventario Excel</button>
          <input type="file" id="archivo-inv" accept=".xls,.xlsx" hidden>
        </div>
      </div>

      <main id="resultados" aria-live="polite"></main>

      <p class="pie">Esta pantalla solo consulta: los datos salen de Tango y no se modifica nada. Acá están los artículos que llevan partidas; el stock de los demás se ve en Buscar artículo. Los lotes de cada artículo están en el orden en que se dieron de alta en Tango.</p>
    </div>
  </div>
</div>

<script src="/comun.js"></script>
<script>
(() => {
  "use strict";
  HT.iniciar("stock");
  const $ = id => document.getElementById(id);
  const ui = {
    q: $("q"), limpiar: $("limpiar"), deposito: $("deposito"), vacios: $("vacios"),
    negativos: $("negativos"), cantNeg: $("cantNeg"), resultados: $("resultados"),
    estado: $("estado"), actualizar: $("actualizar"),
  };
  const EPS = 0.0001;
  const MAX_ARTICULOS = 30;
  const fmt = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 });
  const fmtHora = d => d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
  const num = n => fmt.format(n).replace("-", "\u2212");

  let filas = [];          // partidas tal como vienen de Tango
  let modoNegativos = false;

  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const sinCeros = s => s.replace(/^0+/, "");
  const unidad = um => ({ KG: "kg", KGR: "kg", UNI: "u.", "C/U": "u." })[um.toUpperCase()] || um.toLowerCase();

  function el(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  // ---------------------------------------------------------------- datos
  async function cargar(forzar) {
    ui.resultados.classList.add("cargando");
    ui.estado.textContent = "Consultando Tango…";
    let previo = null;
    // La API de la herramienta usa nombres claros; aca se pasan a nombres cortos de trabajo
    const usar = d => {
      filas = d.datos.map(x => {
        const f = { id: x.id_partida, art: x.codigo_articulo, desc: x.descripcion, dep: x.deposito,
                    part: x.partida, desp: x.despacho, venc: x.vencimiento, um: x.unidad, s: x.saldo };
        f._txt = norm([f.art, f.desc, f.part, f.desp].join(" "));
        f._art = sinCeros(norm(f.art));
        return f;
      });
      ui.estado.textContent = HT.textoDatos(d);
      render();
    };
    try {
      usar(await HT.pedir("/api/stock/partidas", forzar, { previo: g => { previo = g; usar(g); } }));
    } catch (e) {
      if (previo) { ui.estado.textContent = HT.textoDatos(previo).replace("actualizando…", "sin conexión con Tango"); return; }
      ui.estado.textContent = "Sin datos";
      ui.resultados.replaceChildren(mensajeError(e.message === "Failed to fetch"
        ? HT.textoError(e)
        : e.message));
    } finally {
      ui.resultados.classList.remove("cargando");
    }
  }

  function mensajeError(texto) {
    const d = el("div", "error");
    d.append(el("p", "", texto));
    const b = el("button", "boton-texto", "Volver a intentar");
    b.type = "button"; b.addEventListener("click", () => cargar(true));
    d.append(b);
    return d;
  }

  // ---------------------------------------------------------------- filtros
  function filasDelDeposito() {
    const dep = ui.deposito.value;
    return dep ? filas.filter(f => f.dep.toUpperCase() === dep) : filas;
  }

  function agrupar(lista) {
    const grupos = new Map();
    for (const f of lista) {
      if (!grupos.has(f.art)) grupos.set(f.art, { art: f.art, desc: f.desc, um: f.um, lotes: [] });
      grupos.get(f.art).lotes.push(f);
    }
    for (const g of grupos.values()) {
      g.lotes.sort((a, b) => (a.id ?? 0) - (b.id ?? 0));
      g.total = g.lotes.reduce((a, f) => a + f.s, 0);
      g.conSaldo = g.lotes.filter(f => Math.abs(f.s) > EPS);
      g.negativos = g.lotes.filter(f => f.s < -EPS);
      // Un negativo solo se compensa con stock del mismo deposito
      const porDep = {};
      for (const f of g.lotes) porDep[f.dep] = (porDep[f.dep] || 0) + f.s;
      g.depsEnNegativo = [...new Set(g.negativos.map(f => f.dep))].filter(d => porDep[d] < -EPS);
    }
    return [...grupos.values()];
  }

  function buscar(texto) {
    const base = filasDelDeposito();
    const tokens = norm(texto).split(/\s+/).filter(Boolean);
    const coinciden = base.filter(f => tokens.every(t => f._txt.includes(t) || f._art.includes(sinCeros(t))));
    const q = sinCeros(norm(texto));
    const arts = new Set(coinciden.map(c => c.art));
    return agrupar(base.filter(f => arts.has(f.art)))
      .filter(g => g.conSaldo.length || ui.vacios.checked)
      .sort((a, b) => {
        const ea = sinCeros(norm(a.art)) === q ? 0 : 1, eb = sinCeros(norm(b.art)) === q ? 0 : 1;
        return ea - eb || a.desc.localeCompare(b.desc, "es");
      });
  }

  function gruposNegativos() {
    return agrupar(filasDelDeposito())
      .filter(g => g.negativos.length)
      .sort((a, b) => Math.min(...a.negativos.map(f => f.s)) - Math.min(...b.negativos.map(f => f.s)));
  }

  // ---------------------------------------------------------------- dibujo
  // Exportar: los lotes que corresponden a lo que se esta viendo (busqueda, deposito, negativos)
  let visibles = [];
  $("exportar").addEventListener("click", () => {
    if (!visibles.length) { HT.avisar("No hay lotes para exportar con esta búsqueda."); return; }
    const titulo = d => d ? d.charAt(0) + d.slice(1).toLowerCase() : "";
    HT.exportar("Stock por partida" + (modoNegativos ? " - negativos" : ui.q.value.trim() ? " - " + ui.q.value.trim() : ""),
      [["Código"], ["Descripción"], ["Depósito"], ["Partida"], ["Despacho"], ["Vencimiento"], ["Unidad"], ["Saldo", "numero"]],
      visibles.map(f => [f.art, f.desc, titulo(f.dep), f.part, f.desp, HT.fecha(f.venc), HT.unidad(f.um), f.s]));
  });

  // ---------------------------------------------------------------- comparar con el Excel de inventario
  // Se sube el Inventario_Metco (.xls o .xlsx); el servidor lo compara con los saldos de Tango
  // (contra Central; los otros depositos aparte) y devuelve el detalle y un Excel con todo. No toca Tango.
  let comparacion = null;       // resultado mientras se ve la comparacion
  let filtroComp = "dif";
  const GRUPOS_COMP = [
    { id: "dif", titulo: "Diferencias", estados: ["Tango tiene menos", "Tango tiene más"] },
    { id: "unidad", titulo: "Unidad para revisar", estados: ["Revisar unidad"] },
    { id: "falta", titulo: "No están en Tango", estados: ["No está en Tango"] },
    { id: "solo", titulo: "Solo en Tango", estados: ["Solo en Tango"] },
  ];
  $("comparar").addEventListener("click", () => $("archivo-inv").click());
  $("archivo-inv").addEventListener("change", async () => {
    const f = $("archivo-inv").files[0];
    $("archivo-inv").value = "";
    if (!f) return;
    comparacion = { cargando: f.name };
    dibujarComparacion();
    try {
      const b64 = await new Promise((ok, mal) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result).split(",")[1] || "");
        r.onerror = () => mal(new Error("No se pudo leer el archivo."));
        r.readAsDataURL(f);
      });
      const resp = await fetch("/api/inventario/comparar", { method: "POST", cache: "no-store",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nombre: f.name, archivo: b64 }) });
      let d; try { d = await resp.json(); } catch { d = { ok: false, error: `El programa respondió algo inesperado (código ${resp.status}).` }; }
      if (!d.ok) throw new Error(d.error || "No se pudo comparar.");
      comparacion = d.datos;
      filtroComp = GRUPOS_COMP.find(g => g.estados.some(e => (comparacion.resumen.estados[e] || 0) > 0))?.id || "dif";
    } catch (e) {
      comparacion = { error: HT.textoError(e) };
    }
    dibujarComparacion();
  });

  function descargarComparacion() {
    const bin = atob(comparacion.archivo);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const a = el("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const base = (comparacion.resumen.archivo || "inventario").replace(/\.xlsx?$/i, "");
    a.download = `Comparación ${base} vs Tango ${new Date().toLocaleDateString("es-AR").replace(/\//g, "-")}.xlsx`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  function dibujarComparacion() {
    const c = comparacion;
    const frag = document.createDocumentFragment();
    const volver = el("button", "boton chico", "‹ Volver al stock"); volver.type = "button";
    volver.addEventListener("click", () => { comparacion = null; render(); });
    if (c.cargando) {
      const t = el("div", "tarjeta comp-cab");
      t.append(el("b", "", `Comparando ${c.cargando} con Tango…`), el("p", "nota", "Se lee el Excel y se cruza con los saldos actuales. Tarda unos segundos."));
      frag.append(t, HT.esqueleto(6));
      ui.resultados.replaceChildren(frag); return;
    }
    if (c.error) {
      frag.append(volver, HT.cajaError(c.error, () => $("archivo-inv").click()));
      ui.resultados.replaceChildren(frag); return;
    }
    const r = c.resumen, est = r.estados;
    const cab = el("div", "tarjeta comp-cab");
    cab.append(el("h2", "", `${r.archivo || "Inventario"} vs Tango`),
      el("p", "nota", `Saldos de Tango de las ${HT.hora(new Date(r.saldos_tango))} h · ${fmt.format(r.articulos_comparados)} artículos del Excel (${r.hojas.join(", ")}) · comparado contra el depósito Central`));
    const cifras = el("div", "comp-cifras");
    const cifra = (n, t, cl) => { const d = el("div", "comp-cifra " + (cl || "")); d.append(el("b", "", fmt.format(n || 0)), el("span", "", t)); cifras.append(d); };
    cifra(est["Coincide"], "coinciden", "c-ok");
    cifra((est["Tango tiene menos"] || 0) + (est["Tango tiene más"] || 0), "con diferencias", "c-mal");
    cifra(est["No está en Tango"], "no están en Tango", "c-aviso");
    cifra(est["Solo en Tango"], "solo en Tango", "c-aviso");
    if (est["Revisar unidad"]) cifra(est["Revisar unidad"], "unidad para revisar", "c-aviso");
    cab.append(cifras);
    const acc = el("div", "comp-acciones");
    const desc = el("button", "boton primario chico", "Descargar Excel de resultados"); desc.type = "button"; desc.addEventListener("click", descargarComparacion);
    const otra = el("button", "boton chico", "Comparar otro archivo"); otra.type = "button"; otra.addEventListener("click", () => $("archivo-inv").click());
    acc.append(desc, otra, volver);
    cab.append(acc,
      el("p", "nota", "Diferencia = Tango Central − Excel. Polvos y alambres pasados de libras a kilos. Si el Excel es de hace unos días, los remitos y ajustes posteriores también aparecen como diferencia. No se modifica nada en Tango."));
    frag.append(cab);

    const pest = el("div", "filtros comp-filtros");
    for (const g of GRUPOS_COMP) {
      const n = g.estados.reduce((a, e) => a + (est[e] || 0), 0);
      if (!n && g.id !== filtroComp) continue;
      const b = el("button", "filtro", g.titulo); b.type = "button"; b.setAttribute("aria-pressed", String(g.id === filtroComp));
      b.append(el("b", "", fmt.format(n)));
      b.addEventListener("click", () => { filtroComp = g.id; dibujarComparacion(); });
      pest.append(b);
    }
    frag.append(pest);
    const g = GRUPOS_COMP.find(x => x.id === filtroComp);
    const filas = c.filas.filter(f => g.estados.includes(f.estado));
    if (!filas.length) frag.append(el("p", "aviso", "No hay artículos en este grupo."));
    else {
      const tabla = el("table", "tabla tarjeta comp-tabla");
      const th = el("tr");
      for (const [x, cl] of [["Artículo", ""], ["Excel", "der"], ["Tango Central", "der"], ["Diferencia", "der"], ["Notas", ""]]) th.append(el("th", cl, x));
      const thead = el("thead"); thead.append(th); const tb = el("tbody");
      for (const f of filas) {
        const tr = el("tr");
        const art = el("td");
        const cod = f.codigo_tango || f.codigo_excel;
        if (f.codigo_tango) { const a = el("a", "", f.descripcion_tango || f.descripcion_excel || cod); a.href = "/buscar?art=" + encodeURIComponent(f.codigo_tango); art.append(a); }
        else art.append(el("span", "", f.descripcion_excel || cod));
        art.firstChild.style.fontWeight = "600";
        art.append(el("div", "nota", [cod, f.tipo].filter(Boolean).join(" · ")));
        const u = HT.unidad(f.unidad_tango) || f.unidad_excel || "";
        const excel = f.excel_en_unidad_tango == null ? (f.cantidad_excel == null ? "—" : `${num(f.cantidad_excel)} ${f.unidad_excel}`) : `${num(f.excel_en_unidad_tango)} ${u}`;
        const difCl = f.diferencia == null ? "" : f.diferencia < 0 ? " neg-dif" : " pos-dif";
        tr.append(art, el("td", "der", excel), el("td", "der", f.codigo_tango ? `${num(f.tango_central)} ${u}` : "—"),
                  el("td", "der" + difCl, f.diferencia == null ? "—" : (f.diferencia > 0 ? "+" : "") + num(f.diferencia)),
                  el("td", "comp-notas", [f.tango_otros_depositos && "Otros depósitos: " + f.tango_otros_depositos, f.notas].filter(Boolean).join(" · ")));
        tb.append(tr);
      }
      tabla.append(thead, tb);
      frag.append(tabla);
      if (c.total_distintas > c.filas.length) frag.append(el("p", "mas", `Se ven ${fmt.format(c.filas.length)} de ${fmt.format(c.total_distintas)}. El Excel de resultados tiene todos.`));
    }
    ui.resultados.replaceChildren(frag);
  }

  function render() {
    if (comparacion) { dibujarComparacion(); return; }
    const texto = ui.q.value;
    ui.limpiar.hidden = !texto;
    const negs = agrupar(filasDelDeposito()).reduce((a, g) => a + g.negativos.length, 0);
    ui.cantNeg.textContent = negs ? `(${negs})` : "";
    ui.negativos.hidden = !negs && !modoNegativos;
    ui.negativos.setAttribute("aria-pressed", String(modoNegativos));
    if (!filas.length) return;
    visibles = [];

    const nombreDep = ui.deposito.value ? "Central" : "todos los depósitos";
    let grupos;
    const frag = document.createDocumentFragment();

    if (modoNegativos) {
      grupos = gruposNegativos();
      frag.append(el("p", "resumen",
        `${negs} lotes en negativo en ${grupos.length} artículos (${nombreDep}). Un lote negativo quiere decir que salió más de lo que entró en ese lote.`));
    } else if (!norm(texto)) {
      const conSaldo = filasDelDeposito().filter(f => Math.abs(f.s) > EPS);
      visibles = conSaldo;
      const arts = new Set(conSaldo.map(f => f.art)).size;
      const a = el("div", "aviso");
      const p = el("p");
      p.append("Hay ", el("strong", "", fmt.format(conSaldo.length) + " lotes con stock"),
        ` de ${fmt.format(arts)} artículos en ${nombreDep}.`);
      a.append(p, el("p", "", "Buscá por código, descripción, número de lote o despacho."));
      ui.resultados.replaceChildren(a);
      return;
    } else {
      grupos = buscar(texto);
      if (!grupos.length) {
        const a = el("div", "aviso");
        const p = el("p");
        p.append("Nada coincide con ", el("strong", "", `«${texto.trim()}»`), ` en ${nombreDep}.`);
        a.append(p, el("p", "", ui.deposito.value
          ? "Probá con menos palabras o elegí Todos los depósitos."
          : "Probá con menos palabras o con parte del código."));
        ui.resultados.replaceChildren(a);
        return;
      }
      frag.append(el("p", "resumen", grupos.length === 1 ? "1 artículo" : `${grupos.length} artículos`));
    }

    visibles = grupos.flatMap(g => modoNegativos ? g.negativos : g.lotes);
    const grilla = el("div", "grilla-art");
    for (const g of grupos.slice(0, MAX_ARTICULOS)) grilla.append(tarjeta(g));
    frag.append(grilla);
    if (grupos.length > MAX_ARTICULOS) {
      frag.append(el("p", "mas", `Se muestran ${MAX_ARTICULOS} de ${grupos.length}. Escribí más para achicar la búsqueda.`));
    }
    ui.resultados.replaceChildren(frag);
  }

  function tarjeta(g) {
    const art = el("article", "articulo");
    const cab = el("div", "art-cab");
    cab.append(el("div", "art-cod", g.art), el("div", "art-desc", g.desc));
    const tot = el("div", "art-total" + (g.total < -EPS ? " neg" : ""));
    tot.append(el("span", "num", num(g.total)), el("span", "um", unidad(g.um)));
    cab.append(tot);

    const n = g.lotes.filter(f => f.s > EPS).length;
    let nota = n === 0 ? "Sin stock" : n === 1 ? "1 lote con stock" : `${n} lotes con stock`;
    const notaEl = el("div", "art-nota");
    if (g.negativos.length) {
      notaEl.classList.add("alerta");
      const deps = g.depsEnNegativo;
      nota += !deps.length
        ? ". Hay lotes en negativo pero el depósito tiene stock en otros lotes: probablemente se descontó del lote equivocado."
        : ". El artículo queda en negativo en " + deps.map(d => d.charAt(0) + d.slice(1).toLowerCase()).join(" y ") + ": falta registrar mercadería en Tango.";
    }
    notaEl.textContent = nota;
    cab.append(notaEl);
    art.append(cab);

    const mostrar = (ui.vacios.checked ? g.lotes : g.conSaldo);
    if (mostrar.length) {
      const positivos = g.lotes.filter(f => f.s > EPS).reduce((a, f) => a + f.s, 0);
      const ul = el("ul", "lotes");
      const todos = !ui.deposito.value;
      for (const f of mostrar) {
        const li = el("li", "lote" + (f.s < -EPS ? " neg" : Math.abs(f.s) <= EPS ? " vacio" : ""));
        li.append(el("div", "lote-num", "Lote " + (f.part || "sin número")),
                  el("div", "lote-saldo", num(f.s) + " " + unidad(f.um)));
        const meta = el("div", "lote-meta");
        if (todos) meta.append(el("span", "lote-dep", f.dep));
        if (f.desp) meta.append(el("span", "", "Despacho " + f.desp));
        if (f.venc) {
          const v = new Date(f.venc + "T00:00:00");
          const vencida = v < new Date();
          meta.append(el("span", vencida ? "vencida" : "",
            (vencida ? "Venció " : "Vence ") + v.toLocaleDateString("es-AR")));
        }
        if (meta.childNodes.length) li.append(meta);
        if (f.s > EPS && positivos > 0) {
          const nivel = el("div", "nivel");
          nivel.setAttribute("aria-hidden", "true");
          const barra = el("span");
          barra.style.width = Math.max(2, Math.round(f.s / positivos * 100)) + "%";
          nivel.append(barra);
          li.append(nivel);
        }
        ul.append(li);
      }
      art.append(ul);
    }
    return art;
  }

  // ---------------------------------------------------------------- eventos
  let espera;
  ui.q.addEventListener("input", () => {
    if (modoNegativos && ui.q.value) modoNegativos = false;
    clearTimeout(espera); espera = setTimeout(render, 120);
  });
  ui.limpiar.addEventListener("click", () => { ui.q.value = ""; render(); ui.q.focus(); });
  ui.deposito.addEventListener("change", render);
  ui.vacios.addEventListener("change", render);
  ui.negativos.addEventListener("click", () => {
    modoNegativos = !modoNegativos;
    if (modoNegativos) ui.q.value = "";
    render();
  });
  ui.actualizar.addEventListener("click", () => cargar(true));

  // Llegar con una busqueda (?q=) o directo a los negativos (#negativos)
  const inicial = new URLSearchParams(location.search).get("q");
  if (inicial) { ui.q.value = inicial; ui.limpiar.hidden = false; }
  if (location.hash === "#negativos") modoNegativos = true;
  cargar(false);
})();
</script>
</body>
</html>
