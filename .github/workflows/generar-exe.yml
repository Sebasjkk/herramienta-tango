# Prueba el codigo y genera HerramientaTango.exe en una maquina Windows de GitHub
# cada vez que se sube un cambio a la rama main. Lo publica como Release.
name: Generar exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Poner numero de version
        shell: pwsh
        run: |
          $v = "1.${{ github.run_number }}"
          $ruta = "herramienta_tango/__init__.py"
          $codigo = Get-Content $ruta -Raw -Encoding utf8
          $codigo = $codigo -replace 'VERSION = "[^"]*"', "VERSION = `"$v`""
          Set-Content $ruta $codigo -Encoding utf8 -NoNewline
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Instalar PyInstaller
        run: python -m pip install "pyinstaller==6.*"

      - name: Generar el exe
        run: >
          python -m PyInstaller --onefile --name HerramientaTango
          --add-data "herramienta_tango/web/estatico;herramienta_tango/web/estatico"
          HerramientaTango.py

      - name: Probar que el exe arranca
        shell: pwsh
        run: |
          $salida = & dist\HerramientaTango.exe --version
          if ($LASTEXITCODE -ne 0) { throw "El exe no arranca (codigo $LASTEXITCODE)" }
          if ($salida -notmatch [regex]::Escape($env:VERSION)) { throw "Version incorrecta: $salida" }
          Write-Output $salida

      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path dist\HerramientaTango.exe, README.md -DestinationPath HerramientaTango.zip

      - name: Publicar version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Version ${{ env.VERSION }}
          body: "Generado desde el commit ${{ github.sha }}."
          files: HerramientaTango.zip
          make_latest: true
